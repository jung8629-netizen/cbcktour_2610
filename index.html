<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>종교개혁 투어 · 방문지 해설</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="종교개혁투어">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#f6f1e7; --paper2:#fffdf8; --ink:#1e1b16; --ink2:#4a4239; --ink3:#7a6f61;
  --line:#ded3c0; --line2:#c9bca4; --accent:#8c2f1f; --accent2:#b8442c;
  --gold:#f5d76e; --gold-d:#c9a227; --land:#e8e0cf; --landline:#c3b69c; --sea:#eef2f3;
  --chip:#efe7d6; --shadow:0 8px 30px rgba(60,45,20,.16);
  --extra-bg:#eceae4; --extra-line:#cfcabd;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  --paper:#181613; --paper2:#211e1a; --ink:#eee7db; --ink2:#c4bbab; --ink3:#8e8474;
  --line:#3a342c; --line2:#4d4438; --accent:#e0714f; --accent2:#ef8b68;
  --gold:#d6b64a; --gold-d:#8a7220; --land:#2b2823; --landline:#4a4339; --sea:#14171a;
  --chip:#2b2721; --shadow:0 8px 30px rgba(0,0,0,.5);
  --extra-bg:#232019; --extra-line:#3d382e;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px; line-height:1.62; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ── 헤더 ── */
header{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;
  gap:8px;padding:0 12px;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
header h1{font-size:15px;font-weight:800;margin:0;letter-spacing:-.02em;white-space:nowrap}
header h1 small{display:block;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.04em}
.spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--chip);border-radius:9px;padding:3px}
.tabs button{padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.tabs button[aria-selected="true"]{background:var(--paper2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}

/* ── 뷰 ── */
main{position:absolute;inset:52px 0 0 0;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;overscroll-behavior:contain}
.view.on{display:block}
.pad{max-width:760px;margin:0 auto;padding:18px 16px 120px}

/* ── 지도 ── */
#mapwrap{position:absolute;inset:0;background:var(--sea);touch-action:none;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.country{fill:var(--land);stroke:var(--landline);stroke-width:.9;vector-effect:non-scaling-stroke}
.route{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-dasharray:11 9;stroke-linecap:round;
  vector-effect:non-scaling-stroke;opacity:.85}
.route-done{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pin{cursor:pointer}
.pin circle.dot{fill:var(--accent);stroke:#fff;stroke-width:2.2;vector-effect:non-scaling-stroke}
.pin.link circle.dot{fill:var(--ink3)}
.pin.sel circle.dot{fill:var(--accent2);stroke:var(--gold);stroke-width:3.4}
.pin text.num{fill:#fff;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{cursor:pointer}
.lbl rect{fill:var(--gold);stroke:var(--gold-d);stroke-width:1;rx:4}
.pin.link + .lbl rect{fill:var(--chip);stroke:var(--line2)}
.lbl text{font-size:12.5px;font-weight:800;fill:#221c08;dominant-baseline:central;pointer-events:none}
.pin.link + .lbl text{fill:var(--ink2)}
.lbl line{stroke:var(--line2);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.mapctl{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;
  display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:11px;background:var(--paper2);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:17px;font-weight:800;display:grid;place-items:center}
.legend{position:absolute;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;
  background:color-mix(in srgb,var(--paper2) 92%,transparent);border:1px solid var(--line);border-radius:11px;
  padding:8px 11px;font-size:11px;color:var(--ink2);line-height:1.75;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.legend b{color:var(--ink)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:1px}
.legend i.g{background:var(--ink3)}
#gPins.nolbl .lbl{display:none}
#chips{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:22;
  display:none;gap:7px;overflow-x:auto;padding:2px 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px 8px 8px;border-radius:999px;
  background:var(--paper2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;font-weight:800;white-space:nowrap}
#chips button i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:11px;display:grid;place-items:center;flex:none}
#chips button.link i{background:var(--ink3)}
#chips button.sel{border-color:var(--accent);background:var(--gold)}
#chips button.sel,#chips button.sel i{color:#221c08}
@media (max-width:860px){
  #chips{display:flex}
  .legend{display:none}
  .mapctl{bottom:calc(70px + env(safe-area-inset-bottom))}
}

/* ── 상세 시트 ── */
#sheet{
  position:fixed;z-index:60;background:var(--paper2);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.32,.72,0,1);
}
@media (max-width:860px){
  #sheet{left:0;right:0;bottom:0;height:88%;border-radius:20px 20px 0 0;transform:translateY(101%)}
  #sheet.on{transform:translateY(0)}
  #grab{height:22px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none}
  #grab::after{content:"";width:40px;height:4px;border-radius:2px;background:var(--line2)}
}
@media (min-width:861px){
  #sheet{top:52px;right:0;bottom:0;width:min(520px,46vw);border-left:1px solid var(--line);transform:translateX(101%)}
  #sheet.on{transform:translateX(0)}
  #grab{display:none}
}
#sheet .shead{padding:4px 18px 12px;border-bottom:1px solid var(--line);flex:none;position:relative}
#sheet .shead .no{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
  border-radius:5px;padding:2px 7px;letter-spacing:.02em}
#sheet .shead .no.link{background:var(--ink3)}
#sheet .shead h2{margin:8px 0 2px;font-size:23px;letter-spacing:-.03em}
#sheet .shead .sub{font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.02em}
#sheet .shead .tag{margin-top:9px;font-size:14px;color:var(--ink2);font-weight:600;line-height:1.55}
#close{position:absolute;top:2px;right:12px;width:34px;height:34px;border-radius:50%;font-size:19px;color:var(--ink3)}
#sbody{flex:1;overflow:auto;padding:16px 18px 40px;overscroll-behavior:contain}
#snav{flex:none;display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper2)}
#snav button{flex:1;padding:11px 8px;border-radius:11px;background:var(--chip);font-size:13px;font-weight:800;color:var(--ink2)}
#snav button:disabled{opacity:.35}

/* ── 콘텐츠 블록 ── */
.lead{background:var(--chip);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;
  padding:12px 14px;font-size:14px;color:var(--ink2);margin:0 0 22px;line-height:1.68}
.sec{margin:26px 0 10px;font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.12em}
.sec:first-child{margin-top:4px}
.ex{margin:0 0 20px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.ex .exh{display:flex;align-items:baseline;gap:8px;padding:9px 13px;background:var(--chip);border-bottom:1px solid var(--line)}
.ex .exh b{font-size:13px;font-weight:800;letter-spacing:-.01em;flex:1}
.ex .exh span{font-size:11px;font-weight:800;color:var(--accent);white-space:nowrap}
.ex .exb{padding:13px}
.ex p{margin:0 0 11px;font-size:14.6px;line-height:1.80;color:var(--ink);word-break:keep-all}
.ex p:last-child{margin-bottom:0}
.ex mark{background:var(--gold);color:#221c08;border-radius:2px;padding:0 1px}

.ppl{display:grid;gap:8px;margin-bottom:6px}
.ppl div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.ppl b{font-size:14px}
.ppl em{font-style:normal;font-size:11.5px;color:var(--accent);font-weight:800;margin-left:6px}
.ppl p{margin:4px 0 0;font-size:13px;color:var(--ink2);line-height:1.6;word-break:keep-all}

.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl b{flex:none;width:78px;font-size:12px;font-weight:800;color:var(--accent);padding-top:2px;letter-spacing:-.01em}
.tl span{font-size:13.6px;color:var(--ink2);word-break:keep-all}

details.more{margin-top:24px;border:1px solid var(--extra-line);border-radius:12px;background:var(--extra-bg);overflow:hidden}
details.more summary{padding:12px 14px;font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"▾";margin-left:auto;color:var(--ink3);transition:transform .2s}
details.more[open] summary::after{transform:rotate(180deg)}
details.more .mb{padding:0 14px 14px;font-size:13.6px;line-height:1.78;color:var(--ink2);word-break:keep-all}
details.more .warn{font-size:11px;color:var(--ink3);font-weight:700;border-top:1px dashed var(--extra-line);padding-top:9px;margin-top:11px}
.ofl{display:flex;align-items:center;gap:10px;border-radius:11px;padding:12px 14px;margin:0 0 20px;
  font-size:13.4px;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--ink2)}
.ofl b{display:block;font-size:13.4px}
.ofl small{display:block;font-weight:600;color:var(--ink3);font-size:11.5px;margin-top:2px}
.ofl .ic{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:14px;background:var(--ink3);color:#fff}
.ofl.ok{border-color:#3f7d4e;background:color-mix(in srgb,#3f7d4e 12%,var(--paper2))}
.ofl.ok .ic{background:#3f7d4e}
.ofl.wait .ic{background:var(--gold-d)}
.nxt{margin-top:22px;padding:12px 14px;border:1px dashed var(--line2);border-radius:11px;
  font-size:13.4px;color:var(--ink2);font-weight:600;word-break:keep-all}

/* ── 연표 ── */
.tlist{position:relative;padding-left:26px}
.tlist::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tev{position:relative;margin-bottom:16px;cursor:pointer}
.tev::before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--accent)}
.tev.dim::before{border-color:var(--line2)}
.tev .y{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
.tev.dim .y{color:var(--ink3)}
.tev .e{font-size:14.4px;margin-top:1px;word-break:keep-all}
.tev .w{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:2px}

/* ── 인물 ── */
.pcard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--paper2);cursor:pointer}
.pcard b{font-size:15.5px}
.pcard em{font-style:normal;font-size:12px;color:var(--accent);font-weight:800;margin-left:7px}
.pcard p{margin:5px 0 0;font-size:13.4px;color:var(--ink2);line-height:1.66;word-break:keep-all}
.pcard p .pw{font-weight:800;color:var(--accent);font-size:12px;margin-right:5px}

/* ── 검색 ── */
.sbox{position:sticky;top:0;background:var(--paper);padding:14px 0 12px;z-index:5}
.sbox input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line2);
  background:var(--paper2);color:var(--ink);font:inherit;font-size:15px}
.sbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12.5px;color:var(--ink3);margin:8px 2px 0}
.hit{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;cursor:pointer;background:var(--paper2)}
.hit .hh{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:5px}
.hit .ht{font-size:13.6px;color:var(--ink2);line-height:1.7;word-break:keep-all}
.hit mark{background:var(--gold);color:#221c08}

.intro{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--paper2);margin-bottom:18px}
.intro h3{margin:0 0 8px;font-size:16px}
.intro p{margin:0 0 8px;font-size:13.6px;color:var(--ink2);line-height:1.72;word-break:keep-all}
.intro p:last-child{margin:0}
.src{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.8}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;
  background:var(--chip);color:var(--ink3);border:1px solid var(--line);margin-left:6px;vertical-align:2px}
</style>
</head>
<body>

<header>
  <h1>종교개혁 투어<small>DOCENT · 16 STOPS</small></h1>
  <div class="spacer"></div>
  <div class="tabs" role="tablist">
    <button id="t-map"    role="tab" aria-selected="true">지도</button>
    <button id="t-time"   role="tab" aria-selected="false">연표</button>
    <button id="t-people" role="tab" aria-selected="false">인물</button>
    <button id="t-search" role="tab" aria-selected="false">검색</button>
  </div>
</header>

<main>
  <section class="view on" id="v-map">
    <div id="mapwrap"><svg id="svg"></svg></div>
    <div class="legend">
      <b>유럽 종교개혁 투어</b><br>
      <i></i>책에 서술이 있는 곳 (11)<br>
      <i class="g"></i>연결 대목으로 보는 곳 (5)<br>
      <span style="opacity:.75">번호를 누르면 해설이 열립니다</span>
    </div>
    <div id="chips"></div>
    <div class="mapctl">
      <button id="about" title="안내와 출처">ⓘ</button>
      <button id="play"  title="이동 경로 재생">▶</button>
      <button id="zin"   title="확대">+</button>
      <button id="zout"  title="축소">−</button>
      <button id="zrst"  title="초기화">⟳</button>
    </div>
  </section>

  <section class="view" id="v-time"><div class="pad">
    <div class="intro"><h3>전체 연표</h3>
      <p id="tlnote">항목을 누르면 해당 방문지 해설이 열립니다.</p></div>
    <div class="tlist" id="timeline"></div>
  </div></section>

  <section class="view" id="v-people"><div class="pad">
    <div class="intro"><h3>인물 인덱스</h3>
      <p>책에 등장하는 인물 가운데 이 투어의 방문지와 직접 얽힌 사람들입니다. 카드를 누르면 그 사람의 도시로 이동합니다.</p></div>
    <div id="people"></div>
  </div></section>

  <section class="view" id="v-search"><div class="pad">
    <div class="sbox"><input id="q" type="search" placeholder="예: 양심, 침례, 화형, 프리드리히, 1525" autocomplete="off"></div>
    <div class="hint" id="qhint">앱에 실린 책 발췌 전체에서 찾습니다.</div>
    <div id="hits" style="margin-top:14px"></div>
  </div></section>
</main>

<aside id="sheet" aria-hidden="true">
  <div id="grab"></div>
  <div class="shead">
    <button id="close" aria-label="닫기">✕</button>
    <span class="no" id="s-no">01</span>
    <h2 id="s-ko"></h2>
    <div class="sub" id="s-sub"></div>
    <div class="tag" id="s-tag"></div>
  </div>
  <div id="sbody"></div>
  <div id="snav">
    <button id="prev">◀ 이전</button>
    <button id="next">다음 ▶</button>
  </div>

 온 핵심 원리들을 하나의 해석의 기준으로 삼아 교회 역사를 살펴봅니다. 그 기준의 핵심 원리는 다음 다섯 가지입니다. 이 원리들은 침례교 역사를 관통해 온 근간이자 신약 교회의 본질을 이루는 요소들입니다.① 성경의 절대적 권위 ② 다시 태어난 신자들의 교회③ 신자 침례와 침수례 ④ 양심의 자유와 정교분리⑤ 회중 정치와 지역 교회의 자율성"]}, {"p": 9, "h": "저자가 독자에게 던지는 질문", "t": ["이 책은 독자가 교회와 신앙을 당연하게 받아들이기보다 성경이 제시하는 교회의 모습 앞에 자신을 비추어 보도록 돕고자 합니다.- 오늘날 교회는 초대 신약 교회와 얼마나 가까운가?- 우리는 성경의 절대적 권위를 실제로 따르고 있는가?- 우리는 신자 침례, 구원받은 신자들 교회, 양심의 자유, 회중 정치를 얼마나 진지"]}, {"p": 9, "h": "이 책이 남기고 싶은 한 문장", "t": ["침례교는 새로운 운동이 아닙니다. 신약 교회를 회복하려는 운동입니다. 이처럼 단순하면서도 결정적인 진리가 이 책을 통해 더욱 선명하게 드러나기를 바랍니다."]}], "ppl": [], "tl": [], "nxt": "→ 버스는 북동쪽으로 200km를 달려 2번 아이제나흐, 루터가 성경을 번역한 바르트부르크 성으로 갑니다.", "more": "프랑크푸르트는 종교개혁기에 신성로마제국의 핵심 상업·인쇄 도시였습니다. 1240년부터 열린 프랑크푸르트 서적 시장은 당시 유럽 최대 규모로, 루터의 저작과 종교개혁 팸플릿이 유럽 전역으로 퍼져 나간 통로였습니다. 시 자체는 1533년 루터파를 공식 도입했습니다. 또한 1356년 금인칙서 이후 황제 선출 도시였고 1562년부터는 대관식도 이곳 대성당에서 열렸습니다 — 루터를 소환한 카를 5세도 이 제국 질서의 정점에 있던 인물입니다.", "ko": "프랑크푸르트", "en": "Frankfurt am Main", "x": 474.3, "y": 375.6}, {"n": 2, "mode": "core", "tag": "보름스에서 '납치'된 루터가 숨어 지내며 독일어 신약을 번역한 성.", "sub": "Eisenach · 독일 · 바르트부르크 성", "lead": "1521년 보름스에서 제국의 법 밖에 놓인 루터는 프리드리히 선제후의 계획된 '납치'로 이 성에 숨습니다. 그리고 10개월 동안, 단 11주 만에 신약 성경 전체를 독일어로 옮깁니다.", "ex": [{"p": 211, "h": "보호를 위한 '납치'", "t": ["그러나 프리드리히 선제후가 그를 살렸다. 루터가 보름스를 떠나 비텐베르크로 돌아가는 길에 선제후의 부하들이 루터를 ‘납치’했는데, 이는 루터를 보호하기 위해 미리 준비된 작전이었다. 루터는 바르트부르크 성으로 옮겨져서 안전하게 숨을 수 있었다."]}, {"p": 211, "h": "융커 요르크 - 기사 조지", "t": ["바르트부르크 성에서 루터는 ‘융커 요르크’(Junker Jrg, 기사 조지)라는 가명을 사용했다. 그는 수염을 기르고 기사의 옷을 입었으며 거의 10개월 동안 그곳에 머물렀다."]}, {"p": 212, "h": "에라스무스 그리스어 신약과 공인 본문", "t": ["루터는 이 시간을 생산적으로 사용했다. 그는 신약 성경을 독일어로 번역하기 시작했다. 그는 에라스무스가 편집한 그리스어 신약 성경을 사용했다. 에라스무스가 편집한 1516년 그리스어 신약은 이후 공인 본문(Textus Receptus)의 기초가 되어 루터 성경, 틴데일 성경, 킹제임스 성경에 결정적 영향을 미쳤다. 그는 사본을 비교하면서 천주교가 선호하던 알렉산드리아 계열 소수 사본을 채택하지 않았다. 이 사본들이 당시 교회가 널리 사용하던 비잔틴 다수 사본 전통과 크게 달랐기 때문이다. 또한 소수 사본에는 축약과 생략 등 편집의 흔적이 있다고 보았다. 반면 여러 지역에서 일관되게 보존된 다수 사본은 원본의 신뢰할 만한 증거라고 판단했다. 이러한 이유로 그의 본문은 다수 본문 계열을 따르게 되었고 이는 종교 개혁의 성경 번역 운동을 이끄는 토대가 되었다.", "놀랍게도 루터는 단 11주 만에 신약 성경 전체를 번역했다."]}, {"p": 212, "h": "시장에서 들은 말로 번역하다", "t": ["루터의 번역은 단순한 직역이 아니었다. 그는 독일 사람들이 실제로 사용하는 언어로 번역했다. 그는 시장에 가서 사람들의 말을 들었고 어린이들의 말을 관찰했다. 그는 생동감 있고 이해하기 쉬운 독일어로 성경을 번역했다.", "1522년 9월, 루터의 독일어 신약 성경이 드디어 출판되었다. 이 성경은 흔히 ‘9월 신약’(September Testament)이라 불리며, 초판 3,000부가 몇 달 만에 모두 팔려 나갔다. 이어서 재판이 계속 나왔고 독일 전역에 빠르게 퍼져 나갔다. 독일 사람들은 마침내 자기 언어로 된 하나님의 말씀을 읽을 수 있게 되었고, 루터의 번역은 독일어 자체의 표준화를 이끄는 결정적 계기가 되었다."]}, {"p": 213, "h": "세 가지 영향", "t": ["루터의 독일어 성경은 엄청난 영향을 미쳤다. 첫째, 종교 개혁의 확산에 결정적 역할을 했다. 사람들이 성경을 읽으면서 루터가 가르치는 것이 진리임을 스스로 확인할 수 있었다. 둘째, 독일어 자체의 표준화에 기여했다. 당시 독일은 많은 방언들로 나뉘어 있었는데 루터의 성경이 표준 독일어의 기초가 되었다. 셋째, 독일 문화와 교육에 큰 영향을 주었다."]}], "ppl": [{"nm": "마르틴 루터", "yr": "1483-1546", "d": "이곳에서 '융커 요르크'라는 가명으로 10개월을 숨어 지내며 신약을 번역했다."}, {"nm": "에라스무스", "yr": "1466?-1536", "d": "1516년 편집한 그리스어 신약이 공인 본문의 기초가 되어 루터·틴데일·킹제임스 성경에 영향을 주었다."}], "tl": [["1521.5", "바르트부르크 성으로 피신, 융커 요르크로 위장"], ["1521-22", "11주 만에 신약 성경 독일어 번역"], ["1522.9", "'9월 신약' 출판, 초판 3,000부 완판"], ["1534", "루터 성경전서(독일어 완역) 출판"]], "nxt": "→ 다음은 3번 에르푸르트. 루터가 대학을 다니고 수도사가 된 도시입니다.", "more": "현장에서 볼 것 — 바르트부르크 성 안의 '루터 방'(Lutherstube). 루터가 번역 작업을 한 좁은 방으로, 창밖으로 튀링겐 숲이 내려다보입니다. 벽의 얼룩은 '루터가 마귀에게 잉크병을 던졌다'는 전설로 유명하지만 후대에 만들어진 이야기입니다. 성 자체는 1067년에 세워졌고 1999년 유네스코 세계유산에 등재되었습니다.", "ko": "아이제나흐", "en": "Eisenach", "x": 594.5, "y": 306.2}, {"n": 3, "mode": "core", "tag": "법학도 루터가 수도사가 되어 들어간 어거스틴 수도원의 도시.", "sub": "Erfurt · 독일 · 에르푸르트 대학 · 어거스틴 수도원", "lead": "루터는 여기서 석사를 받았고, 아버지의 뜻대로 법학을 하려 했습니다. 그러나 서원 하나가 그를 수도원으로 데려갑니다. 그리고 수도원에서 그는 평안을 찾지 못합니다.", "ex": [{"p": 206, "h": "대학생 루터", "t": ["루터는 총명한 학생이었다. 그는 에르푸르트 대학에서 공부했고 1505년 석사 학위를 받았다. 아버지는 루터가 법학을 공부하기를 원했고 루터도 그 길을 가려 했다. 그러나 1505년 7월 2일 그의 인생이 완전히 바뀌는 사건이 일어났다."]}, {"p": 206, "h": "법학을 버리고 수도원으로", "t": ["폭풍이 지나간 후 루터는 자신의 서원을 지켜야 한다고 생각했다. 그는 법학 공부를 포기하고 1505년 7월 17일 에르푸르트의 어거스틴(아우구스티누스) 수도회에 들어갔다. 아버지는 분노했지만 루터는 돌아서지 않았다."]}, {"p": 206, "h": "고해 신부를 지치게 한 사람", "t": ["루터는 모범적인 수도사가 되려고 노력했고 엄격하게 수도원의 규율을 지켰다. 금식하고 기도하고 고행했다. 그는 자신의 죄를 고백하기 위해 시간마다 고해 성사에 갔다. 때로는 여섯 시간 동안 죄를 고백했다고 한다. 그의 고해 신부가 지쳐서 말했다. “루터, 하나님께서는 자네에게 화를 내지 않으신다네. 오히려 지금 자네가 하나님께 화를 내고 있어!”"]}, {"p": 207, "h": "★ 평안을 찾지 못하다", "t": ["그러나 루터는 평안을 찾을 수 없었고 스스로에게 물었다. “나는 충분히 회개했는가? 내가 고백하지 않은 죄가 있지는 않은가? 나는 하나님을 충분히 사랑하는가?” 그는 하나님의 거룩함 앞에서 자신의 죄악을 너무나 선명하게 보았고 결코 하나님의 기준에 도달할 수 없다는 절망에 빠졌다."]}, {"p": 207, "h": "에르푸르트를 떠나 비텐베르크로", "t": ["1507년에 루터는 사제 서품을 받았고 1508년에 비텐베르크 대학에서 가르치기 시작했다. 1512년에 그는 신학 박사 학위를 받았고 성경 교수가 되었고 시편, 로마서, 갈라디아서, 히브리서를 강의했다."]}], "ppl": [{"nm": "마르틴 루터", "yr": "1483-1546", "d": "1505년 에르푸르트 대학 석사, 같은 해 7월 17일 이곳 어거스틴 수도회 입회."}], "tl": [["1501", "에르푸르트 대학 입학"], ["1505", "석사 학위 취득"], ["1505.7.17", "어거스틴(아우구스티누스) 수도회 입회"], ["1507", "사제 서품"], ["1508", "비텐베르크 대학에서 가르치기 시작"]], "nxt": "→ 다음은 4번 슈토테른하임. 에르푸르트에서 북쪽으로 불과 10km, 그 서원이 일어난 바로 그 들판입니다.", "more": "현장에서 볼 것 — 아우구스티너클로스터(Augustinerkloster), 루터가 1505년부터 1511년까지 수도사로 산 수도원입니다. 그의 수도실이 복원되어 있습니다. 또한 크래머 다리(Krämerbrücke)는 다리 위에 집이 늘어선 중세 구조물로, 루터가 매일 건너다닌 길입니다.", "ko": "에르푸르트", "en": "Erfurt", "x": 646.3, "y": 305.9}, {"n": 4, "mode": "core", "tag": "벼락이 떨어진 들판. 여기서 한 법학도가 수도사가 되겠다고 소리쳤습니다.", "sub": "Stotternheim · 독일 · 1505년 7월 2일", "lead": "책에 '슈토테른하임'이라는 지명은 나오지 않습니다. 그러나 책이 서술한 '에르푸르트로 돌아가는 길의 폭풍'이 바로 이곳입니다. 종교개혁의 실질적 출발점이 된 6초간의 사건입니다.", "ex": [{"p": 206, "h": "그가 누구였나", "t": ["마르틴 루터는 1483년 11월 10일 독일 아이슬레벤에서 태어났다. 그의 아버지 한스 루터는 광부였지만 나중에 성공한 사업가가 되었다. 루터는 엄격한 가정에서 자랐다. 그의 부모는 독실한 카톨릭 신자였고 어린 루터에게 하나님에 대한 두려움을 심어 주었다. 그러나 그것은 사랑의 하나님에 대한 두려움이 아니라 심판하는 하나님에 대한 공포였다."]}, {"p": 206, "h": "1505년 7월 2일, 인생이 바뀐 날", "t": ["루터는 총명한 학생이었다. 그는 에르푸르트 대학에서 공부했고 1505년 석사 학위를 받았다. 아버지는 루터가 법학을 공부하기를 원했고 루터도 그 길을 가려 했다. 그러나 1505년 7월 2일 그의 인생이 완전히 바뀌는 사건이 일어났다."]}, {"p": 206, "h": "★ 바로 이곳에서 일어난 일", "t": ["루터는 에르푸르트로 돌아가는 길에 갑작스러운 폭풍을 만났는데 번개가 그의 바로 옆에 떨어졌다. 공포에 질린 루터는 “성 안나시여! 저를 구해 주소서! 제가 수도사가 되겠습니다!”라고 외쳤다. 성 안나는 광부들의 수호성인이었고 루터는 죽음의 공포 속에서 서원을 한 것이다."]}, {"p": 206, "h": "서원을 지키다", "t": ["폭풍이 지나간 후 루터는 자신의 서원을 지켜야 한다고 생각했다. 그는 법학 공부를 포기하고 1505년 7월 17일 에르푸르트의 어거스틴(아우구스티누스) 수도회에 들어갔다. 아버지는 분노했지만 루터는 돌아서지 않았다."]}], "ppl": [{"nm": "성 안나", "yr": "—", "d": "광부들의 수호성인. 광부의 아들이었던 루터가 죽음의 공포 속에서 부른 이름이다."}], "tl": [["1505.7.2", "슈토테른하임 인근에서 벼락을 만나 서원"], ["1505.7.17", "서원을 지켜 에르푸르트 어거스틴 수도회 입회"]], "nxt": "→ 다음은 5번 라이프치히. 수도사가 된 루터가 14년 뒤 교황의 권위를 공개적으로 부정하는 자리입니다.", "more": "현장에서 볼 것 — 슈토테른하임 외곽 들판에 서 있는 '루터슈타인'(Lutherstein, 루터의 돌). 1917년 종교개혁 400주년에 세워진 기념비로, 라틴어 서원 문구가 새겨져 있습니다. 마을 자체는 작은 농촌이라 별도의 관광 시설은 없고, 이 돌 하나가 전부입니다. 하지만 이 6초가 없었다면 루터는 변호사가 되었을 것입니다.", "ko": "슈토테른하임", "en": "Stotternheim", "x": 649.2, "y": 300.2}, {"n": 5, "mode": "core", "tag": "1519년, 루터가 '교황도 공의회도 틀릴 수 있다'고 공개 선언한 토론장.", "sub": "Leipzig · 독일 · 1519 라이프치히 논쟁", "lead": "아우구스부르크에서 철회를 거부한 루터는 여기서 한 걸음 더 나갑니다. 로마 측 대표 요한 에크와의 공개 토론에서, 그는 교회 권위 자체의 무오성을 부정합니다. 이 발언이 파문으로 가는 문을 열었습니다.", "ex": [{"p": 210, "h": "★ 라이프치히 논쟁 - 교황도 오류를 범할 수 있다", "t": ["그러나 루터는 생각을 바꾸지 않았고 오히려 더욱 대담해졌다. 1518년 아우구스부르크에서 교황 특사 카예탄 추기경과 만났을 때 루터는 철회를 거부했다. 이어 1519년 라이프치히 논쟁에서는 로마 측 대표 요한 에크(Johann Eck, 1486-1543)와 공개 토론을 벌이며 교황의 무오성과 공의회 권위가 절대적일 수 없으며 교황과 공의회도 오류를 범할 수 있다고 공개적으로 선언했다."]}, {"p": 210, "h": "그 결과 - 교황 교서와 교서 소각", "t": ["1520년 교황 레오 10세는 교황 교서 ‘주여 일어나소서!’를 발표했는데 이 교서는 루터의 41개 주장을 이단으로 정죄하고 60일 내에 철회하지 않으면 파문하겠다고 위협했다. 그러나 루터의 대응은 극적이었다. 1520년 12월 10일, 비텐베르크 성문 밖에서 루터는 학생들과 시민들이 지켜보는 가운데 교황 교서를 불태웠는데, 이는 로마 교회와의 완전한 결별을 상징했다."]}, {"p": 210, "h": "파문, 그리고 프리드리히 선제후", "t": ["드디어 1521년 1월 3일, 교황은 마침내 루터에게 공식적인 파문을 선언했다. 그러나 루터는 완전히 고립되지 않았다. 그에게는 강력한 후원자인 작센의 선제후인 현자 프리드리히(Frederick the Wise, 1463-1525)가 있었기 때문이다. 그는 끝까지 루터를 보호하며 위험한 순간마다 결정적 역할을 했다. 선제후(Elector)는 중세·근세 독일의 신성 로마 제국에서 황제를 선출할 법적 권한을 가진 제후를 의미한다. 이들은 제국 내에서 가장 높은 지위를 가진 통치자들로 정치·군사·종교 문제에서 막강한 영향력을 행사했다. 프리드리히는 작센(Saxony)의 선제후로 루터를 직접 지지한 인물은 아니었지만 법적 절차와 독일의 자주권을 지킨다는 이유로 루터를 보호한 통치자였다."]}], "ppl": [{"nm": "요한 에크", "yr": "1486-1543", "d": "잉골슈타트 대학 신학자. 라이프치히 논쟁에서 로마 측 대표로 루터와 맞섰다."}, {"nm": "현자 프리드리히", "yr": "1463-1525", "d": "작센 선제후. 루터를 직접 지지하진 않았으나 법적 절차와 독일의 자주권을 이유로 그를 보호했다."}], "tl": [["1518", "아우구스부르크에서 카예탄 추기경에게 철회 거부"], ["1519", "라이프치히 논쟁 - 교황·공의회의 무오성 부정"], ["1520", "교황 교서 '주여 일어나소서!' - 41개 주장 이단 정죄"], ["1520.12.10", "비텐베르크 성문 밖에서 교황 교서 소각"], ["1521.1.3", "공식 파문"]], "nxt": "→ 다음은 6번 비텐베르크. 95개조가 붙었고 교황 교서가 불탄, 종교개혁의 진원지입니다.", "more": "현장에서 볼 것 — 논쟁이 열린 곳은 플라이센부르크 성(Pleißenburg)으로, 지금은 그 자리에 신시청사(Neues Rathaus)가 서 있습니다. 토마스교회(Thomaskirche)는 1539년 루터가 직접 설교해 라이프치히의 종교개혁을 선포한 곳이자, 훗날 바흐가 27년간 칸토르로 일하고 묻힌 곳입니다.", "ko": "라이프치히", "en": "Leipzig", "x": 744.4, "y": 276.5}, {"n": 6, "mode": "core", "tag": "1517년 10월 31일, 성 교회 문에 종이 한 장이 붙었습니다.", "sub": "Wittenberg · 독일 · 95개조 논제 · 종교개혁의 진원지", "lead": "루터가 가르치고, 깨닫고, 95개조를 붙이고, 교황 교서를 불태운 도시. 이 투어의 신학적 중심입니다.", "ex": [{"p": 208, "h": "발단 - 면죄부와 테첼", "t": ["1517년 루터는 면죄부 판매의 남용에 분노했다. 테첼(Johann Tetzel, 1465-1519)이라는 도미니코회 수도사가 독일 전역을 다니며 면죄부를 팔고 있었다. 테첼은 이렇게 외쳤다. “동전이 헌금함에 떨어져 짤랑 소리를 내는 순간 연옥에서 고통받던 영혼이 그 자리에서 풀려나 곧바로 천국으로 날아갑니다!”", "면죄부는 교황이 발행하는 문서로 그들은 이 면죄부를 사면 연옥에서의 벌이 감면된다고 주장했다. 교황 레오 10세는 성 베드로 대성당 건축 자금을 마련하기 위해 면죄부를 판매했다. 테첼은 유능한 판매원이었고 가난한 농부들까지 마지막 돈을 털어 면죄부를 샀다."]}, {"p": 205, "h": "★ 1517년 10월 31일, 성 교회 문 앞", "t": ["1517년 10월 31일, 비텐베르크 성 교회 문 앞에는 사람들이 모여들기 시작했다. 무슨 일인가 하고 다가가 보니, 문에 한 장의 라틴어 문서가 게시되어 있었는데 그것은 바로 95개조 논제였다. 문서의 작성자는 비텐베르크 대학의 신학 교수, 마르틴 루터였다.", "그날 루터는 자신이 무엇을 시작하고 있는지 완전히 알지 못했다. 그는 단지 학문적 토론을 제안하려 했을 뿐이지만 그 문서는 유럽을 뒤흔드는 폭풍의 시작이었다. 그것은 천 년 동안 유럽을 지배해 온 로마 카톨릭교회의 독점을 깨뜨리는 시작이었다. 즉, 그것은 종교 개혁의 시작이었다."]}, {"p": 209, "h": "95개조 논제 핵심 조항", "t": ["제1조: “우리의 주시며 선생이신 예수 그리스도께서 ‘회개하라’고 명하셨을 때 그분은 신자의 전 생애가 회개의 삶이 되어야 함을 말씀하신 것이다.”", "제27조: “동전이 헌금함에 떨어지는 순간 연옥에서 고통받던 영혼이 곧바로 하늘로 날아간다고 가르치는 자들은, 하나님의 말씀이 아니라 인간이 만든 교리를 설교하는 것이다.”", "제36조: “참되게 회개하는 모든 그리스도인은 면죄부가 없어도 죄와 형벌로부터 완전한 사면을 받는다.”", "제62조: “교회의 참된 보화는 하나님의 영광과 은혜가 담긴 가장 거룩한 복음이다.”"]}, {"p": 209, "h": "인쇄술을 타고 번지다", "t": ["95개조 논제는 놀라운 속도로 퍼져 나갔다. 인쇄술 덕분에 몇 주 만에 독일 전역으로, 몇 달 만에 유럽 전역으로 확산되었다. 사람들은 마침내 누군가 교회의 부패를 공개적으로 비판했다는 것에 환호했다."]}, {"p": 207, "h": "탑에서의 경험 - 복음의 발견", "t": ["루터의 영적 투쟁은 계속되었다. 그는 로마서를 연구하면서 한 구절에 걸려 넘어졌다. ‘하나님의 의’(the righteousness of God)라는 말이 루터를 괴롭혔다. 그는 이를 ‘죄를 심판하시는 하나님의 공의’로 이해했다. 그는 이렇게 회상했다. “나는 ‘하나님의 의’라는 말을 미워했습니다. 왜냐하면 나는 하나님께서 의로우시기 때문에 죄인들을 벌하신다고 배웠기 때문입니다. 나는 하나님을 사랑할 수 없었습니다. 오히려 하나님을 원망하고 미워했습니다.”", "그러나 루터가 계속 이 구절을 묵상하면서 빛이 비치기 시작했다. 이는 1518년이나 1519년경 비텐베르크 수도원의 탑 방에서 일어난 것으로 추정된다(이를 ‘탑에서의 경험’이라고 부른다). 루터는 깨달았다. 여기에서 말하는 ‘하나님의 의’는 우리를 정죄하는 하나님의 속성이 아니라 하나님께서 우리에게 거저 주시는 선물이라는 것을!"]}, {"p": 208, "h": "루터가 회상한 그 순간", "t": ["루터는 나중에 이렇게 썼다. “마침내 나는 하나님의 긍휼로 밤낮으로 묵상하면서 문맥에 주의를 기울였다. ‘하나님의 의가 계시되어 있나니… 의인은 믿음으로 살리라’(롬 1:17). 그때 나는 하나님의 의가 의인이 하나님의 선물로, 즉 믿음으로 사는 그 의라는 것을 깨달았다. 여기에서 나는 하나님의 의를 수동적 의로, 즉 은혜로우신 하나님께서 우리를 믿음으로 의롭다 인정하심으로 의롭게 하시는 그 의로 이해해야 한다는 것을 느꼈다. 이때 나는 완전히 다시 태어난 것 같았고 열린 문들을 통해 낙원 자체로 들어간 것 같았다.”"]}, {"p": 210, "h": "1520년 12월 10일, 교황 교서 소각", "t": ["1520년 교황 레오 10세는 교황 교서 ‘주여 일어나소서!’를 발표했는데 이 교서는 루터의 41개 주장을 이단으로 정죄하고 60일 내에 철회하지 않으면 파문하겠다고 위협했다. 그러나 루터의 대응은 극적이었다. 1520년 12월 10일, 비텐베르크 성문 밖에서 루터는 학생들과 시민들이 지켜보는 가운데 교황 교서를 불태웠는데, 이는 로마 교회와의 완전한 결별을 상징했다."]}], "ppl": [{"nm": "마르틴 루터", "yr": "1483-1546", "d": "1508년부터 비텐베르크 대학에서 가르쳤고 1512년 신학 박사·성경 교수가 되었다."}, {"nm": "요한 테첼", "yr": "1465-1519", "d": "도미니코회 수도사. 독일 전역을 다니며 면죄부를 판매했다."}, {"nm": "교황 레오 10세", "yr": "재위 1513-1521", "d": "성 베드로 대성당 건축 자금을 위해 면죄부를 판매했고 루터를 파문했다."}], "tl": [["1508", "비텐베르크 대학 강의 시작"], ["1512", "신학 박사, 성경 교수"], ["1517.10.31", "95개조 논제 게시"], ["1518-19", "탑에서의 경험"], ["1520.12.10", "교황 교서 소각"], ["1522.9", "'9월 신약' 출판"]], "nxt": "→ 다음은 7번 드레스덴. 루터를 지켜 준 작센이라는 땅을 지나갑니다.", "more": "현장에서 볼 것 — 슐로스키르헤(성 교회)의 청동문에 95개조 라틴어 원문이 새겨져 있습니다(1858년 제작, 원래 나무문은 1760년 화재로 소실). 루터와 멜란히톤의 묘가 이 교회 안에 있습니다. 시내 교회(Stadtkirche St. Marien)는 루터가 실제로 설교한 강단이 있는 곳이고, 루터하우스(Lutherhaus)는 그가 살던 옛 수도원 건물입니다.", "ko": "비텐베르크", "en": "Lutherstadt Wittenberg", "x": 764.1, "y": 233.2}, {"n": 7, "mode": "link", "tag": "루터를 살린 것은 신학이 아니라 한 선제후의 정치적 결단이었습니다.", "sub": "Dresden · 독일 · 작센", "lead": "이 도시는 책에 나오지 않습니다. 다만 여기는 작센입니다. 책에서 루터를 두 번 살린 인물, 작센 선제후 현자 프리드리히의 땅이지요. 개혁이 살아남는 데 정치 권력이 어떤 역할을 했는지 생각해 보기 좋은 자리입니다.", "ex": [{"p": 210, "h": "★ 작센의 선제후 - 루터를 보호한 통치자", "t": ["드디어 1521년 1월 3일, 교황은 마침내 루터에게 공식적인 파문을 선언했다. 그러나 루터는 완전히 고립되지 않았다. 그에게는 강력한 후원자인 작센의 선제후인 현자 프리드리히(Frederick the Wise, 1463-1525)가 있었기 때문이다. 그는 끝까지 루터를 보호하며 위험한 순간마다 결정적 역할을 했다. 선제후(Elector)는 중세·근세 독일의 신성 로마 제국에서 황제를 선출할 법적 권한을 가진 제후를 의미한다. 이들은 제국 내에서 가장 높은 지위를 가진 통치자들로 정치·군사·종교 문제에서 막강한 영향력을 행사했다. 프리드리히는 작센(Saxony)의 선제후로 루터를 직접 지지한 인물은 아니었지만 법적 절차와 독일의 자주권을 지킨다는 이유로 루터를 보호한 통치자였다."]}, {"p": 211, "h": "보름스 이후, 그를 살린 작전", "t": ["그러나 프리드리히 선제후가 그를 살렸다. 루터가 보름스를 떠나 비텐베르크로 돌아가는 길에 선제후의 부하들이 루터를 ‘납치’했는데, 이는 루터를 보호하기 위해 미리 준비된 작전이었다. 루터는 바르트부르크 성으로 옮겨져서 안전하게 숨을 수 있었다."]}, {"p": 215, "h": "그 원칙의 끝 - 제후가 종교를 결정하다", "t": ["결과적으로 독일의 각 지역에서 제후가 종교를 결정했다. 제후가 루터파를 선택하면 그 지역 백성들도 루터파가 되어야 했다. 이는 1555년 아우구스부르크 화의에서 “그 지역의 종교는 그 지역 통치자의 종교를 따른다.”는 원칙으로 공식화되었다."]}], "ppl": [{"nm": "현자 프리드리히", "yr": "1463-1525", "d": "바로 이 작센 땅의 통치자. 파문·보름스 칙령 두 번 모두 루터를 살려 낸 것은 신학이 아니라 이 사람의 정치적 결단이었다."}], "tl": [["1521.1", "루터 파문 - 프리드리히가 보호에 나섬"], ["1521.5", "보름스 귀환길 '납치' 작전, 바르트부르크로"], ["1555", "아우구스부르크 화의 - 제후가 종교를 결정하는 원칙 공식화"]], "nxt": "→ 다음은 8번 뉘른베르크. 도시 스스로 종교를 결정한 제국 도시입니다.", "more": "드레스덴은 알베르트계 작센의 수도로, 루터를 보호한 에른스트계 작센(수도 비텐베르크)과는 다른 계열입니다. 알베르트계는 1539년 하인리히 공작 때 루터파로 전환했고, 모리츠 공작은 1547년 뮐베르크 전투에서 황제 편에 서서 에른스트계로부터 선제후위를 빼앗았습니다. 현장에서 볼 것 — 프라우엔키르헤(성모교회)는 1726-43년 시민들의 헌금으로 지은 개신교 바로크 교회로, 1945년 폭격으로 무너진 잔해를 1994-2005년에 원래 돌을 골라 다시 쌓아 복원했습니다. 검게 그을린 옛 돌과 밝은 새 돌이 섞인 외벽이 그 흔적입니다.", "ko": "드레스덴", "en": "Dresden", "x": 844.2, "y": 300.1}, {"n": 8, "mode": "link", "tag": "'그 지역의 종교는 그 지역 통치자의 종교를 따른다' — 개혁이 도달한 타협점.", "sub": "Nürnberg · 독일 · 제국 도시", "lead": "이 도시도 책에 나오지 않습니다. 그러나 뉘른베르크는 제국 도시 가운데 가장 먼저 스스로 루터파를 택한 곳입니다. 책이 종교개혁의 '한계'라고 지적하는 바로 그 지점 — 신앙이 통치자의 결정 사항이 된 문제 — 을 여기서 마주하게 됩니다.", "ex": [{"p": 215, "h": "★ 제후가 종교를 결정하다", "t": ["결과적으로 독일의 각 지역에서 제후가 종교를 결정했다. 제후가 루터파를 선택하면 그 지역 백성들도 루터파가 되어야 했다. 이는 1555년 아우구스부르크 화의에서 “그 지역의 종교는 그 지역 통치자의 종교를 따른다.”는 원칙으로 공식화되었다."]}, {"p": 215, "h": "★ 책의 평가 - 종교의 자유가 아니라 강제였다", "t": ["이는 종교의 자유가 아니라 종교의 강제였다. 단지 누가 강제하는가만 바뀌었을 뿐이다. 이후로는 교황이 아니라 제후가 강제하게 된 것이다."]}, {"p": 140, "h": "왕의 종교가 나라의 종교가 되던 시대", "t": ["이는 16세기 종교 개혁 후에 더욱 명확해졌다. 루터 이후 1555년 아우구스부르크 화의는 “그 지역의 종교는 그 지역 통치자의 종교를 따른다.”는 원칙을 확립했다."]}, {"p": 246, "h": "이에 맞선 원리 - 정교분리", "t": ["3. 정교분리: 이는 아마도 가장 혁명적인 원리였을 것이다. 만약 교회가 믿는 자들의 자발적 공동체라면 국가는 교회를 강제할 수 없고 반대로 교회도 국가 권력을 사용할 수 없다. 이 원리는 천 년 이상 지속되어 온 기독교계의 국가 교회 개념을 정면으로 거부하는 것이었다."]}, {"p": 246, "h": "이에 맞선 원리 - 양심의 자유", "t": ["4. 양심의 자유: 각 사람은 하나님 앞에서 자신의 양심에 따라 믿을 권리가 있고 아무도 다른 사람의 신앙을 강제할 수 없다."]}], "ppl": [], "tl": [["1525", "뉘른베르크, 제국 도시 중 앞장서 루터파 공식 채택"], ["1532", "뉘른베르크 종교 화의 - 잠정 평화"], ["1555", "아우구스부르크 화의 - '통치자의 종교' 원칙 확립"]], "nxt": "→ 다음은 9번 뮌헨. 개혁이 끝내 닿지 못한 카톨릭의 거점입니다.", "more": "뉘른베르크는 1525년 제국 도시 중 선구적으로 루터파를 공식 채택했고, 신학자 안드레아스 오시안더(1498-1552)가 그 개혁을 이끌었습니다. 1532년의 '뉘른베르크 종교 화의'(Nürnberger Anstand)는 오스만 제국의 위협에 맞서 병력이 필요했던 카를 5세가 슈말칼덴 동맹의 개신교 제후들과 맺은 잠정 평화로, 1555년 아우크스부르크 화의의 예고편에 해당합니다. 현장에서 볼 것 — 성 로렌츠 교회와 성 제발두스 교회(둘 다 루터파로 전환된 고딕 성당), 그리고 화가 알브레히트 뒤러(1471-1528)의 생가. 뒤러는 루터의 지지자였습니다.", "ko": "뉘른베르크", "en": "Nürnberg", "x": 649.5, "y": 427.7}, {"n": 9, "mode": "link", "tag": "개혁이 닿지 못한 곳. 교회가 칼을 들면 무슨 일이 일어나는가.", "sub": "München · 독일 · 바이에른", "lead": "바이에른은 끝까지 카톨릭으로 남았고 반종교개혁의 거점이 되었습니다. 책에 이 도시는 없지만, 책의 제5장 전체가 '교회가 국가 권력을 사용할 때 무엇이 파괴되는가'를 다룹니다. 그 장을 여기서 읽습니다.", "ex": [{"p": 143, "h": "★ 교회가 칼을 들 때 무엇이 파괴되는가", "t": ["오늘날에도 많은 그리스도인들은 “진리를 위해 어느 정도의 강제는 필요하지 않은가?”, “국가의 힘을 빌려 도덕과 신앙을 지키는 것이 왜 나쁜가?”라는 질문을 자연스럽게 던진다. 그러나 중세 역사 속에서 이러한 생각이 실제로 어떤 결과를 낳았는지를 보면 교회가 칼을 들 때 무엇이 파괴되는지 선명하게 드러난다. 476년 서로마 제국이 무너진 이후 로마 카톨릭교회는 정치, 법, 교육, 경제, 군사 기능까지 떠안으며 대륙을 지배했고 권력이 커질수록 복음은 뒤로 밀려났다."]}, {"p": 144, "h": "세 사건의 공통점", "t": ["이 세 사건은 서로 다른 시대에 일어났지만 하나의 공통점을 가진다. 교회가 국가의 권력을 사용하여 사람들을 굴복시켰다는 것이다. 교회가 칼을 들었고 교회가 강제로 억압했으며 교회가 죽였다. 그리고 이 모든 것의 신학적 뿌리는 4세기 어거스틴이 놓았다. 앞에서 살핀 대로, 어거스틴은 도나투스파 논쟁에서 “강권하여 데려오라.”는 원칙을 확립하며 누가복음 14장 23절을 국가적 강제력의 근거로 사용했다. 그는 강제 무력 사용이 사랑의 도구가 될 수 있다고 가르쳤고 이 사상은 중세에 이르러, 종교 재판소(Inquisition)라는 무서운 나무로 자라났다. 종교 재판소는 어거스틴의 사상을 제도화하고 조직화하고 체계화한 기구였다. 만약 어거스틴의 원리가 ‘이론’이었다면 종교 재판소는 그 이론이 실제 역사 속에서 어떻게 실행되는지를 보여 주는 ‘실천’이었다."]}, {"p": 249, "h": "권력은 무엇을 두려워했는가", "t": ["취리히 시 당국은 재침례교인들을 매우 위험한 집단으로 보았다. 왜 그들을 그토록 두려워했을까? 재침례교인들은 폭력을 사용하지 않았고 정부를 전복하려 하지도 않았다. 그들은 조용하게 모여 성경을 공부하고 기도하는 평화로운 사람들이었다."]}], "ppl": [], "tl": [["1184-1600", "중세 종교 재판소 - 교회가 국가의 칼을 사용하던 시대 (책 제5장)"]], "nxt": "→ 다음은 10번 콘스탄츠. 실제로 후스가 불탄 그 도시로 갑니다.", "more": "뮌헨은 비텔스바흐 가문이 다스린 바이에른 공국의 수도로, 16세기 후반 반종교개혁의 사령부 역할을 했습니다. 빌헬름 5세가 1583-97년에 세운 성 미하엘 교회는 알프스 이북 최대의 르네상스 양식 교회이자 예수회의 거점으로, 종교개혁에 맞선 카톨릭의 자신감을 건축으로 보여 주는 건물입니다. 현장에서 볼 것 — 프라우엔키르헤(뮌헨 성모교회)의 두 양파 돔, 마리엔플라츠의 신시청사 시계인형. 뮌헨은 이 투어에서 종교개혁의 '반대편'을 볼 수 있는 유일한 도시입니다.", "ko": "뮌헨", "en": "München", "x": 686.5, "y": 529.8}, {"n": 10, "mode": "core", "tag": "1415년 7월 6일, 안전 통행증을 받고 온 사람이 화형당했습니다.", "sub": "Konstanz · 독일 · 1414-18 콘스탄츠 공의회", "lead": "루터보다 102년 앞서, 얀 후스는 여기서 같은 말을 했습니다. '나의 양심은 하나님의 말씀에 사로잡혀 있습니다.' 그리고 불탔습니다. 보름스에 가기 전에 반드시 들러야 할 도시입니다.", "ex": [{"p": 193, "h": "공의회와 안전 통행증", "t": ["1414년 콘스탄츠에서 공의회가 소집되었는데 이 공의회의 목적은 교회의 분열을 해결하는 것이었다. 당시 세 명의 교황이 서로 정통성을 주장하고 있었다(대분열 시대). 공의회는 이 문제를 해결하고 또한 이단 문제도 다루기로 했는데 후스와 위클리프가 주요 표적이었다.", "신성 로마 제국의 황제 지기스문트(Sigismund, 1368-1437)는 후스에게 편지를 보내 후스에게 안전 통행증을 주며 공의회에 출석하여 자신을 변호할 기회를 주겠다고 약속했다. 안전 통행증은 후스가 콘스탄츠에 가고 돌아오는 동안 어떤 해도 입지 않을 것을 보장하는 문서였다."]}, {"p": 193, "h": "★ 배신 - '이단자에게 한 약속은 지킬 필요가 없다'", "t": ["1414년 11월 3일 후스는 콘스탄츠에 도착했고 처음에는 자유롭게 다닐 수 있었다. 그러나 11월 28일 그는 갑자기 체포되어 도미니코회 수도원의 감옥에 갇혔고 안전 통행증은 무시되었다. 교회 지도자들은 이렇게 주장했다. “이단자에게 한 약속은 지킬 필요가 없다.”"]}, {"p": 194, "h": "★ 후스의 대답, 그리고 106년 뒤의 루터", "t": ["후스는 이렇게 대답했다. “나는 내가 말하지 않은 것을 철회할 수 없습니다. 내가 실제로 가르친 것들에 대해서는, 만약 그것들이 잘못되었다는 것을 성경으로 증명해 주신다면, 기꺼이 철회하겠습니다. 그러나 나의 양심은 하나님의 말씀에 사로잡혀 있습니다. 성경에 반하는 것을 말하도록 강요받는다면, 나는 거부합니다.”", "이 말은 106년 후 마르틴 루터가 보름스 제국 의회에서 한 말과 거의 똑같다."]}, {"p": 194, "h": "나는 차라리 죽겠습니다", "t": ["후스는 흔들리지 않고 이렇게 말했다. “하나님께서 증인이십니다. 나는 내가 가르친 것들이 진리라고 확신합니다. 나는 거짓을 가르치지 않았습니다. 나는 양심을 거스를 수 없습니다. 내가 진리를 부정한다면, 나는 많은 사람들의 영혼에 해를 끼치게 될 것입니다. 나는 차라리 죽겠습니다.”"]}, {"p": 194, "h": "처형장으로", "t": ["그날, 후스는 처형장으로 끌려갔다. 그들은 그에게 주교의 제의를 입혔다 벗기는 의식을 수행했는데, 이는 그가 사제직에서 파면된다는 것을 상징했다. 그의 머리에는 종이로 만든 모자가 씌워졌는데 거기에는 ‘이단의 우두머리’라는 글이 적혀 있었다.", "후스는 처형장까지 걸어갔다. 군중이 그를 조롱했지만 후스는 평온했다. 그는 기도하고 찬송했으며 주변 사람들을 용서했다. 처형장에서 그는 기둥에 묶였다. 그의 주위에 장작이 쌓인 뒤 마지막 순간에 한 번 더 기회가 주어졌다. “철회하겠는가?” 그러나 후스는 고개를 저었다."]}, {"p": 195, "h": "불길 속의 찬송", "t": ["불이 붙여졌고 후스는 불길 속에서 찬송을 불렀다. “그리스도여, 하나님의 아들이시여, 저를 불쌍히 여기소서.” 그는 계속 기도했다. “제가 지금 겪는 이 두려운 죽음 때문에, 그리고 당신의 복음을 전했다는 이유로 당하는 이 고통 때문에, 저를 받아 주소서.”", "후스는 연기에 질식했거나 불에 타서 죽었고 그의 재는 모아져서 라인 강에 뿌려졌다. 로마 교회는 그의 흔적을 완전히 지우려 했다. 그러나 후스의 죽음은 끝이 아니라 시작이었다."]}, {"p": 196, "h": "'우리 모두가 후스파였다'", "t": ["얀 후스는 종교 개혁의 순교자였다. 그는 루터보다 102년 앞서 죽었지만 루터가 주장하게 될 원리들을 이미 발견하고 선포했다. 루터 자신도 후스의 영향을 인정했다. 루터는 후스의 저작들을 읽고 이렇게 말했다. “나는 이제야 깨달았습니다. 우리 모두가 후스파였다는 것을.”"]}], "ppl": [{"nm": "얀 후스", "yr": "1369-1415", "d": "보헤미아의 개혁자. 성경을 체코어로 번역하고 교회 부패를 비판하다 이곳에서 화형당했다."}, {"nm": "황제 지기스문트", "yr": "1368-1437", "d": "후스에게 안전 통행증을 주었으나 그 약속은 지켜지지 않았다."}, {"nm": "존 위클리프", "yr": "1320?-1384", "d": "후스에게 영향을 준 영국의 개혁자. 이 공의회의 명령으로 1428년 유골이 파헤쳐져 불태워졌다."}], "tl": [["1414.11.3", "후스, 콘스탄츠 도착"], ["1414.11.28", "체포·투옥"], ["1415.6.5-7.6", "재판"], ["1415.7.6", "화형, 재는 라인 강에 뿌려짐"], ["1420-34", "후스파 십자군 5차례 격퇴"]], "nxt": "→ 다음은 11번 제네바. 알프스를 넘어 칼빈의 도시로 갑니다.", "more": "현장에서 볼 것 — 후스가 갇혀 있던 도미니코회 수도원은 현재 슈타이겐베르거 잉젤호텔(Inselhotel)입니다. 화형 장소로 전해지는 곳에는 '후스 돌'(Hussenstein)이 놓여 있고, 후스가 머문 집은 얀 후스 박물관(Hus-Haus)으로 운영됩니다. 라인 강이 보덴 호수에서 흘러나가는 지점이 시내 한복판인데, 그의 재가 뿌려진 그 강입니다.", "ko": "콘스탄츠", "en": "Konstanz", "x": 510.4, "y": 565.9}, {"n": 11, "mode": "core", "tag": "하룻밤만 묵어가려던 26살 청년이 평생 눌러앉은 도시.", "sub": "Genève · 스위스 · 존 칼빈", "lead": "칼빈은 제네바를 '기독교 모범 도시'로 만들려 했습니다. 책은 그 성취와 함께, 그것이 넘어선 선도 함께 기록합니다.", "ex": [{"p": 221, "h": "칼빈의 회심", "t": ["1533년경 칼빈은 회심을 경험했다고 알려져 있지만 정확한 시기와 방법은 알 수 없다. 칼빈 자신은 자신의 회심에 대해 많이 말하지 않았지만 나중에 이렇게 썼다. “하나님께서 갑작스러운 회심으로 내 마음을 복종시키셨다.”"]}, {"p": 222, "h": "「기독교 강요」", "t": ["1536년 칼빈은 26세에「 기독교 강요」의 초판을 출판했다. 이 책은 개신교 개혁 신학의 체계적인 설명이었다.", "초판은 비교적 작았다(6장). 그러나 칼빈은 평생 동안 이 책을 계속 확장하고 개정했고 최종판(1559)은 4권 80장의 방대한 저작이 되었다.「기독교 강요」는 개혁 신학의 가장 중요한 저작 중 하나가 되었다. 칼빈은 명확하고 논리적으로 기독교 교리를 설명했고 하나님에 대한 지식, 죄, 구원, 교회, 성례전, 기독교인의 삶 등을 다루었다."]}, {"p": 222, "h": "★ 하룻밤만 묵으려던 밤 - 파렐의 간청", "t": ["1536년 칼빈은 제네바를 지나가고 있었다. 그는 단지 하룻밤만 머물 계획이었으나 파렐(Guillaume Farel, 1489-1565)이라는 개혁자가 칼빈을 만나 제네바에 머물면서 개혁을 도와달라고 간청했다. 파렐은 매우 열정적으로 요청했고 칼빈이 거부하면 하나님께서 칼빈을 저주하실 것이라고까지 말했다.", "칼빈은 마지못해 동의했다. 그는 조용히 학문 연구를 하기를 원했지만 하나님께서 다른 계획을 가지고 계신다는 것을 깨달았다."]}, {"p": 222, "h": "추방, 그리고 스트라스부르", "t": ["칼빈과 파렐은 제네바에서 엄격한 개혁을 시도했다. 그들은 교회 규율을 확립하려 했고 도덕적 기준을 높이려 했다. 그러나 제네바 시민들은 이를 너무 엄격하다고 느꼈고 1538년에 칼빈과 파렐은 제네바에서 추방되었다.", "칼빈은 스트라스부르로 가서 프랑스 난민 교회의 목사가 되었다. 그는 그곳에서 3년 동안 설교하고 가르치고, 주석과 변증서를 집필하며 비교적 평안한 시기를 보냈다."]}, {"p": 223, "h": "제네바의 개혁 - 당회와 규율", "t": ["칼빈은 제네바를 기독교 모범 도시로 만들려 했다. 그는 교회와 시 정부가 협력하는 체제를 확립했다. 교회는 영적 사안을 담당하고 시 정부는 세속 사안을 담당했지만 둘은 긴밀하게 협력했다.", "칼빈은 ‘교회 규례’를 작성했는데, 이는 교회의 조직, 직분, 규율을 정한 문서였다. 칼빈은 네 가지 직분을 확립했다. 목사(말씀을 설교함), 교사(교리를 가르침), 장로(규율을 감독함), 집사(가난한 자를 돌봄).", "칼빈은 ‘당회’도 조직했고, 이는 목사들과 장로들로 구성된 기구로 교회 규율을 담당했다. 당회는 매주 모여 시민들의 도덕적 행동을 조사했는데 여기에는 술 취함, 도박, 춤, 연극, 간음, 이단 등이 포함되었다. 잘못이 발견되면 경고, 견책, 성찬 정지, 파문 등의 처벌이 내려졌다."]}, {"p": 223, "h": "반발", "t": ["이러한 엄격함은 많은 반발을 일으켰다. 일부 제네바 시민들은 칼빈의 ‘독재’를 싫어했고 특히 ‘자유주의자’로 알려진 그룹이 칼빈을 반대했다. 그들은 칼빈이 외국인(프랑스인)이면서 제네바를 통제하려 한다고 불평했다."]}], "ppl": [{"nm": "존 칼빈", "yr": "1509-1564", "d": "프랑스 누아용 출신. 1541년 제네바로 돌아와 죽을 때까지 머물렀다."}, {"nm": "기욤 파렐", "yr": "1489-1565", "d": "칼빈을 붙잡아 제네바에 머물게 한 개혁자. 거부하면 하나님의 저주를 받을 것이라고까지 말했다."}, {"nm": "세바스티안 카스텔리오", "yr": "1515-1563", "d": "세르베투스 처형을 두고 칼빈을 정면으로 비판했다."}], "tl": [["1536", "「기독교 강요」 초판, 제네바 체류 시작"], ["1538", "칼빈·파렐 제네바에서 추방"], ["1538-41", "스트라스부르 망명"], ["1541.9.13", "제네바 복귀"], ["1555", "반대파 정치적 패배"], ["1559", "「기독교 강요」 최종판 4권 80장"]], "nxt": "→ 다음은 12번 취리히. 츠빙글리의 도시이자, 재침례교회가 태어난 곳입니다.", "more": "현장에서 볼 것 — 생피에르 대성당(Cathédrale St-Pierre)의 칼빈 의자, 그리고 종교개혁 기념비(Mur des Réformateurs, 1909년 칼빈 탄생 400주년에 조성). 파렐·칼빈·베즈·녹스 네 사람의 5m 석상이 나란히 서 있습니다. 세르베투스가 처형된 샹펠(Champel) 언덕에는 1903년 칼빈의 후예들이 '우리 시대의 양심에 따라 이를 유감으로 여긴다'고 새긴 속죄비가 있습니다.", "ko": "제네바", "en": "Genève", "x": 288.5, "y": 674.8}, {"n": 12, "mode": "core", "tag": "1525년 1월 21일 밤, 이 도시의 한 집에서 재침례교회가 태어났습니다.", "sub": "Zürich · 스위스 · 츠빙글리 · 재침례교회의 발상지", "lead": "이 투어 전체에서 책이 가장 많은 분량을 쏟는 도시입니다(69회 언급). 츠빙글리의 개혁이 시작된 곳이자, 그 개혁이 자기 제자들을 처형한 곳입니다.", "ex": [{"p": 238, "h": "성경을 처음부터 순서대로 강해하다", "t": ["취리히에 도착한 츠빙글리는 혁신적인 결정을 내렸다. 그는 전통적인 미사 본문을 따라 설교하는 대신 신약 성경을 처음부터 끝까지 순서대로 강해하기로 한 것이다. 그는 마태복음 1장 1절부터 시작하여 한 구절씩, 한 장씩 설명해 나갔다. 이는 당시로서는 매우 파격적인 접근이었다. 중세 교회에서 설교는 교회력에 따라 정해진 본문을 다루는 것이었고 사제의 개인적 해석보다는 교회의 전통적 가르침을 전달하는 것이었다.", "그러나 츠빙글리는 달랐다. 그는 성경 본문 자체를 깊이 파고들었고 교회의 전통을 성경의 빛으로 검토했다. 그의 설교는 폭발적인 반응을 일으켰고 사람들은 처음으로 자기 언어로 성경의 의미를 명확하게 듣게 되었다."]}, {"p": 238, "h": "1523년 - 취리히 개혁의 공식 시작", "t": ["1523년 1월, 취리히 시 의회는 공개 토론회를 열었다. 츠빙글리는 67개조 논제를 제시했고 이를 성경으로 변호했지만 카톨릭 측은 효과적으로 반박하지 못했다. 시 의회는 츠빙글리의 편을 들었고 개혁을 지지하기로 결정했다. 이것이 취리히 종교 개혁의 공식적인 시작이었다."]}, {"p": 239, "h": "세 청년 - 그레벨, 만츠, 블라우록", "t": ["많은 젊은이들이 츠빙글리의 개혁에 열정적으로 동참했다. 그들은 성경을 공부했고 토론했고 개혁을 지지했다. 그중에 몇몇은 츠빙글리의 가장 열렬한 제자들이자 협력자들이 되었다. 콘라트 그레벨(Conrad Grebel, c.1498-1526), 펠릭스 만츠(Felix Manz, c.1498-1527), 게오르그 블라우록(Georg Blaurock, c.1491-1529)이 그들이었다."]}, {"p": 240, "h": "그들이 성경에서 발견한 간극", "t": ["그들이 발견한 바는 다음과 같았다. 신약 성경이 보여 주는 교회와 16세기 교회 사이에는 엄청난 간극이 있었다. 신약 교회는 자발적이고 회심한 신자들로 구성되었지만 16세기 교회는 강제적이고 전체 인구를 포함했다. 신약 성경에서 침례는 믿음을 고백한 사람들에게 주어졌지만 16세기에는 갓 태어난 아기들에게 주어졌다."]}, {"p": 243, "h": "★ 그레벨의 반문", "t": ["그러나 젊은 급진파들은 이러한 논리를 받아들일 수 없었고 그레벨은 이렇게 대답했다. “형제여, 당신은 ‘오직 성경’이라고 말했습니다. 그런데 이제는 ‘성경, 그리고 시 의회의 승인’이라고 말합니다. 만약 성경이 명령하는 것을 시 의회가 금지하면 어떻게 하시겠습니까? 우리는 사람에게 순종해야 합니까, 아니면 하나님께 순종해야 합니까?”"]}, {"p": 244, "h": "★ 1525년 1월 21일 밤", "t": ["1525년 1월 21일 저녁, 취리히의 한 집에서 소규모 모임이 있었다. 정확한 장소는 기록에 따라 다르지만 아마도 만츠의 어머니 집이었을 것으로 추정된다. 그곳에 그레벨, 만츠, 블라우록, 그리고 몇몇 다른 사람들이 모였다."]}, {"p": 245, "h": "★ 최초의 신자 침례", "t": ["그때 블라우록이 일어서서 그레벨에게 다가갔다. 그리고 이렇게 말했다. “그레벨 형제여, 하나님의 사랑으로 간청하오니 나에게 참된 그리스도인의 침례를 주시오.”", "이 순간은 매우 중요했다. 블라우록은 이미 유아일 때 세례를 받았고 카톨릭 사제로 서품을 받을 때에도 세례의 유효성을 확인받았다. 그러나 이제 그는 그 유아 세례를 인정하지 않았고 그것이 성경적 침례가 아니라고 믿었다. 그는 믿음을 고백하는 성인으로서 성경대로 침례를 받기를 원했다.", "그레벨도 긴장되었을 것이다. 블라우록에게 침례를 주는 순간 그는 취리히 시 의회의 명령을 정면으로 위반하게 되며 반역자가 된다. 그러나 그레벨도 결단했다. 그레벨은 물 한 그릇을 가져와서 블라우록에게 신앙을 고백하게 했다. “당신은 예수 그리스도를 당신의 주님과 구원자로 믿습니까?” “믿습니다.” “당신은 당신의 죄를 회개하고 그리스도를 따르기로 작정했습니까?” “네. 그렇습니다.”"]}, {"p": 219, "h": "사형법 - 침례의 방법으로 죽이다", "t": ["1526년 3월, 취리히 시 의회는 재침례교인들에게 사형을 선고하는 법을 통과시켰다. 재침례를 받거나 주는 자는 물에 빠뜨려 죽인다는 것이었다(아이러니하게도 침례의 방법으로 죽이는 것이다)."]}, {"p": 251, "h": "펠릭스 만츠의 마지막", "t": ["그러나 만츠는 거부하며 이렇게 대답했다. “나는 성경의 명령을 따랐을 뿐입니다. 나는 그리스도께서 명하신 것을 행했습니다. 나는 사람의 전통이 아니라 하나님의 말씀에 순종했습니다. 나는 내 양심을 거스를 수 없습니다.”", "1527년 1월 5일, 시 의회는 만츠의 사형을 결정했는데 처형 방법은 수장형이었다. 이는 일종의 잔인한 조롱이었다. “그가 물로 침례를 주었으니, 물로 죽게 하자.”"]}, {"p": 251, "h": "림마트 강", "t": ["처형관들은 만츠의 손과 발을 묶었다. 그들은 그를 배에 태웠고 배를 강 한가운데로 저어 갔다. 거기서 그들은 만츠를 물속으로 밀어 넣었고 만츠는 가라앉았다 다시 떠올랐다. 그는 여전히 기도하고 있었는데 그들은 그를 다시 물속으로 밀어 넣었다. 이번에는 그가 떠오르지 않았다.", "만츠는 29세의 나이에 순교했다. 그는 성경을 믿은 죄로, 신약 성경의 교리를 따른 죄로, 신자 침례를 실천한 죄로 죽었다. 그의 마지막 말은 이렇게 기록되었다. “하나님께 영광을. 내 영혼을 주님의 손에 맡깁니다.”"]}, {"p": 220, "h": "츠빙글리의 죽음", "t": ["1531년 10월 11일, 제2차 카펠 전투가 벌어지면서 취리히의 개신교 연합군과 카톨릭 연합군이 정면으로 충돌했다. 츠빙글리는 군대의 종군 목사로 전장에 있었고, 전투 중 치명적인 부상을 입어 쓰러졌다. 카톨릭 군인들은 부상당한 츠빙글리를 발견한 뒤 그의 신앙 고백을 요구했으나 츠빙글리가 이를 거부하자 현장에서 즉시 처형했다.", "그의 죽음 이후 시신은 모욕을 당했다. 카톨릭 군대는 츠빙글리의 시신을 사지를 찢고, 심장을 도려내고, 몸을 불태우는 등 극도로 잔혹한 방식으로 훼손했고 마지막으로 남은 재는 바람에 흩어져 사라지도록 내버려졌다. 이는 츠빙글리와 그의 영향력을 완전히 지워 없애려는 상징적 조치였다."]}], "ppl": [{"nm": "울리히 츠빙글리", "yr": "1484-1531", "d": "취리히의 개혁자. 성경 강해 설교로 개혁을 시작했으나 재침례교인 처형을 지지했다."}, {"nm": "콘라트 그레벨", "yr": "1498?-1526", "d": "귀족 가문 출신 지식인. 최초의 신자 침례를 집례했다."}, {"nm": "펠릭스 만츠", "yr": "1498?-1527", "d": "히브리어에 능통한 성경학자. 1527년 1월 5일 림마트 강에서 수장형, 29세."}, {"nm": "게오르그 블라우록", "yr": "1491?-1529", "d": "전직 카톨릭 사제. 최초로 신자 침례를 받은 사람. 별명은 '파란 외투'."}], "tl": [["1519", "츠빙글리, 마태복음 1장부터 순서대로 강해 시작"], ["1523.1", "67개조 논제, 시 의회가 개혁 지지"], ["1525.1.18", "시 의회 최후통첩 - 8일 내 유아 세례 명령"], ["1525.1.21", "★ 최초의 신자 침례 - 재침례교회 탄생"], ["1526.3", "재침례교인 사형법 통과 (수장형)"], ["1527.1.5", "펠릭스 만츠 순교"], ["1531.10.11", "카펠 전투에서 츠빙글리 전사"]], "nxt": "→ 다음은 13번 슐라이트하임. 이 운동이 2년 뒤 자기 신앙을 문서로 정리한 마을입니다.", "more": "현장에서 볼 것 — 그로스뮌스터(Grossmünster)의 츠빙글리 설교 강단. 그 앞 림마트 강변에는 1525-27년 이곳에서 익사형에 처해진 재침례교인들을 기리는 명판이 2004년에야 설치되었습니다. 취리히 개혁교회가 재침례교인 박해에 대해 공식 사과한 것은 2004년입니다 — 477년 만이었습니다.", "ko": "취리히", "en": "Zürich", "x": 464.0, "y": 587.3}, {"n": 13, "mode": "core", "tag": "1527년, 작은 마을에서 7개 조항이 쓰였고 그것이 침례교의 뼈대가 되었습니다.", "sub": "Schleitheim · 스위스 · 1527 슐라이트하임 신앙 고백", "lead": "취리히에서 시작된 운동이 2년 만에 자기 정체성을 문서로 정리합니다. 이 7개 조항을 이끈 사틀러는 석 달 뒤 혀가 잘리고 불태워집니다.", "ex": [{"p": 247, "h": "★ 슐라이트하임 모임", "t": ["1527년 2월 24일, 스위스와 독일 국경 근처의 슐라이트하임이라는 작은 마을에서 재침례교 지도자들의 모임이 열렸다. 이 모임을 주도한 사람은 사틀러(Michael Sattler, 1490-1527)였다. 사틀러는 원래 베네딕트 수도회 수도사였다가 개혁 운동에 합류했고 재침례교인이 되었다. 이 모임에서 ‘슐라이트하임 신앙 고백’이 작성되었는데, 이는 재침례교 신학의 가장 중요한 초기 문서 중 하나이며 후대 침례교 신학에도 큰 영향을 미쳤다."]}, {"p": 247, "h": "제1조 · 침례", "t": ["제1조: 침례 “침례는 믿음과 회개를 통해 자신의 죄가 그리스도의 피로 씻겼다고 진정으로 믿는 모든 사람에게 주어져야 한다.”"]}, {"p": 248, "h": "제2조 · 파문", "t": ["제2조: 파문(출회) 교회는 거룩한 공동체여야 한다. 만약 누군가 죄 가운데 살면서 회개하지 않는다면 교회는 그 사람을 권면하고 경고해야 한다. 만약 계속 회개하지 않으면 교회는 그 사람을 교제에서 제외시켜야 한다(마 18:15-17). 이는 교회가 순수성을 유지하는 방법이다. 재침례교는 교회가 ‘다시 태어난 신자들의 공동체’이기를 원했다."]}, {"p": 248, "h": "제3조 · 주의 만찬", "t": ["제3조: 주의 만찬 주의 만찬은 오직 침례를 받은 신자들만 참여할 수 있고 주의 만찬은 그리스도의 몸의 연합을 상징하므로 교회 밖의 사람들은 참여할 수 없다. 주의 만찬은 단순히 의식이 아니라 교회 공동체의 연합을 표현하는 것이다."]}, {"p": 248, "h": "제4조 · 세상으로부터의 분리", "t": ["제4조: 세상으로부터의 분리 그리스도인은 세상과 구별되어야 하는데 ‘세상’은 하나님을 거부하고 죄 가운데 사는 체계를 의미한다. 그리스도인은 세상의 가치관, 세상의 오락, 세상의 방식을 따르지 않아야 한다. 이는 문화적 고립을 의미하는 것이 아니라 영적 구별을 의미한다. 재침례교인들은 ‘세상에 있되 세상에 속하지 않는 삶’을 살고자 했다."]}, {"p": 248, "h": "제5조 · 목회자", "t": ["제5조: 목회자 각 교회는 목회자가 필요하며 목회자는 교회가 선택해야 하고 외부 권위가 임명해서는 안 된다. 목회자의 역할은 성경을 가르치고 주의 만찬 및 침례 같은 규례를 집행하고 교회를 돌보는 것이다. 목회자는 지배자가 아니라 섬기는 자이다. 이는 회중 정치의 원리를 확립한 것이다."]}, {"p": 248, "h": "제6조 · 칼", "t": ["제6조: 칼 이는 가장 논쟁적인 조항이었다. 재침례교인들은 그리스도인이 ‘칼’, 즉 무력이나 폭력을 사용할 수 없다고 주장했다. 그리스도인은 군인이 될 수 없고 치안 판사가 될 수 없고 사형을 집행할 수 없다. 예수님께서 “네 칼을 도로 칼집에 꽂으라. 칼을 잡는 자들은 다 칼로 망하리라.”(마 26:52)고 가르치셨기 때문이다.", "이는 재침례교인들이 철저한 평화주의자들이었음을 보여 준다. 그들은 비폭력을 실천했고 원수를 사랑했으며 박해하는 자를 위해 기도했다. 이것이 그들이 국가 권력과 결합할 수 없었던 또 다른 이유였다. 국가는 칼을 사용하지만 교회는 칼을 사용할 수 없다."]}, {"p": 249, "h": "제7조 · 맹세", "t": ["제7조: 맹세 그리스도인은 맹세할 수 없다. 예수님께서 맹세하지 말라고 하셨기 때문이다(마 5:34). 그 결과 재침례교인들은 법정에서 맹세를 거부했고 충성 서약을 거부했다. 그들의 ‘예’는 ‘예’이고, ‘아니요’는 ‘아니요’였다. 이것만으로 충분해야 한다. 이는 당시 법체계와 정면으로 충돌했다."]}, {"p": 249, "h": "이 문서의 의의", "t": ["슐라이트하임 신앙 고백은 재침례교 운동의 독특한 정체성을 형성한 문서였다. 이 신조에 담긴 원칙들은 재침례교를 다른 개신교 그룹과 뚜렷하게 구별시켰다. 루터파와 개혁파는 여전히 국가 교회 체제를 유지했고 유아 세례를 시행했으며 그리스도인이 군 복무나 치안 직무를 맡을 수 있다고 보았다. 그러나 재침례교인들은 이러한 모든 관행을 거부했다.", "이 신앙 고백은 후대의 침례교에도 영향을 미쳤다. 침례교는 비록 평화주의(제6조)나 법정에서의 맹세 반대(제7조)에는 동의하지 않았지만 신자 침례, 교회의 순수성, 회중 정치, 그리고 세상과의 구별과 같은 핵심 원리들은 침례교 신학과 정체성을 구성하는 중요한 요소가 되었다."]}, {"p": 252, "h": "★ 사틀러의 순교", "t": ["1527년 5월, 슐라이트하임 신앙 고백을 이끌었던 사틀러는 아내 마르가레타와 함께 체포되어 독일 로텐부르크에서 재판을 받았다. 그는 재침례교 신앙 때문에 이단으로 정죄되었고 판결문에는 “그의 혀를 자르고 뜨거운 쇠로 몸을 일곱 번 지진 뒤 그를 불태워 재로 만들라.”는 끔찍한 형벌이 기록되었다.", "5월 21일, 이 형벌이 집행되었다. 사틀러는 고문 속에서도 박해자들을 위해 기도했고, 화형장 기둥에 묶여 마지막으로 “사랑하는 형제자매 여러분, 참된 증인이 되십시오. 내가 진리를 위해 죽는 것을 보십시오!”라고 외쳤다. 불길이 타오르자 그는 “아버지여, 제 영혼을 당신의 손에 맡깁니다.”라고 기도하며 순교했다. 그의 아내 마르가레타 역시 며칠 뒤 근처 강가에서 수장형을 당했다."]}], "ppl": [{"nm": "미하엘 사틀러", "yr": "1490-1527", "d": "전직 베네딕트 수도사. 슐라이트하임 모임을 주도했고 1527년 5월 21일 로텐부르크에서 순교했다."}, {"nm": "마르가레타 사틀러", "yr": "?-1527", "d": "사틀러의 아내. 남편의 처형 며칠 뒤 근처 강가에서 수장형을 당했다."}], "tl": [["1527.2.24", "슐라이트하임 모임 - 신앙 고백 7개 조항 작성"], ["1527.5.21", "사틀러 순교 (독일 로텐부르크)"], ["1526.11", "슈파이어 제국 회의 - 재침례는 사형 범죄로 선언"]], "nxt": "→ 다음은 14번 스트라스부르. 라인 강을 건너 프랑스로 들어갑니다.", "more": "현장에서 볼 것 — 슐라이트하임은 인구 1,700명 남짓한 스위스 샤프하우젠 주의 작은 마을입니다. 모임 장소로 전해지는 곳은 확정되지 않았고, 마을에 신앙 고백 500주년 관련 기념 표지가 있습니다. 관광지라기보다 순례지에 가까운 곳입니다.", "ko": "슐라이트하임", "en": "Schleitheim", "x": 460.3, "y": 559.1}, {"n": 14, "mode": "core", "tag": "추방당한 칼빈이 3년을 보낸 피난처이자, 중재자 부처의 도시.", "sub": "Strasbourg · 프랑스 · 마르틴 부처", "lead": "1538년 제네바에서 쫓겨난 칼빈은 여기서 프랑스 난민 교회를 목회합니다. 그의 인생에서 가장 평안했던 3년이고, 결혼도 여기서 합니다.", "ex": [{"p": 228, "h": "★ 스트라스부르의 개혁자, 마르틴 부처", "t": ["마르틴 부처(Martin Bucer, 1491-1551)는 스트라스부르의 개혁자였고 루터파와 츠빙글리파 사이를 중재하려 했다. 그는 교회 규율과 목회 돌봄을 강조했고 나중에 영국으로 가서 영국 종교 개혁에 영향을 주었다."]}, {"p": 222, "h": "어쩌다 여기까지 왔나 - 제네바에서 추방", "t": ["칼빈과 파렐은 제네바에서 엄격한 개혁을 시도했다. 그들은 교회 규율을 확립하려 했고 도덕적 기준을 높이려 했다. 그러나 제네바 시민들은 이를 너무 엄격하다고 느꼈고 1538년에 칼빈과 파렐은 제네바에서 추방되었다."]}, {"p": 222, "h": "★ 칼빈의 망명 3년", "t": ["칼빈은 스트라스부르로 가서 프랑스 난민 교회의 목사가 되었다. 그는 그곳에서 3년 동안 설교하고 가르치고, 주석과 변증서를 집필하며 비교적 평안한 시기를 보냈다."]}, {"p": 222, "h": "이델레트와의 결혼, 그리고 제네바 복귀", "t": ["1540년, 그는 이델레트 드 뷔르(Idelette de Bure)와 결혼했다. 이델레트는 재침례교 지도자였던 첫 남편을 잃고 두 자녀를 데리고 살던 과부였으며 남편과 함께 한때 재침례교 운동과 연관된 삶을 살았다. 그녀는 첫 남편이 죽은 뒤 재침례교 공동체로부터 떠나 있었고 칼빈과 결혼한 후에는 개혁파 신앙을 따랐다. 그러나 1541년 제네바 시 의회가 칼빈에게 돌아와 달라고 요청하자 칼빈은 망설였지만 결국 동의했다. 1541년 9월 13일 칼빈은 제네바로 돌아왔고 죽을 때까지 그곳에 머물렀다."]}, {"p": 228, "h": "같은 시대의 또 한 사람 · 멜란히톤", "t": ["필립 멜란히톤(Philip Melanchthon, 1497-1560)은 루터의 가장 가까운 동료였다. 그는 뛰어난 학자이자 교육자였고 ‘아우구스부르크 신앙 고백’(Augsburg Confession, 1530)을 작성했는데, 이는 루터파의 핵심 신앙 고백이 되었다. 멜란히톤은 루터보다 온건했고 카톨릭과의 화해를 모색했다. 그는 루터가 죽은 후 루터파 신학의 발전을 이끌었다."]}], "ppl": [{"nm": "마르틴 부처", "yr": "1491-1551", "d": "스트라스부르의 개혁자. 루터파와 츠빙글리파를 중재하려 했고 나중에 영국 종교개혁에 영향을 주었다."}, {"nm": "이델레트 드 뷔르", "yr": "?-1549", "d": "칼빈의 아내. 재침례교 지도자였던 첫 남편을 잃은 과부였다."}], "tl": [["1538", "칼빈, 제네바에서 추방되어 스트라스부르로"], ["1538-41", "프랑스 난민 교회 목회, 주석·변증서 집필"], ["1540", "이델레트 드 뷔르와 결혼"], ["1541", "제네바 복귀"]], "nxt": "→ 다음은 15번 하이델베르크. 다시 라인 강을 건너 독일로 돌아갑니다.", "more": "현장에서 볼 것 — 스트라스부르 대성당(Cathédrale Notre-Dame)은 1524년부터 1681년까지 루터파 교회였습니다. 칼빈이 목회한 프랑스 난민 교회는 생피에르 르 죈(St-Pierre-le-Jeune) 교회로 전해집니다. 칼빈은 이곳에서 시편 찬송집을 처음 펴냈는데, 이것이 개혁교회 회중 찬송의 출발점이 되었습니다. 참고로 부처는 1518년 하이델베르크 논쟁에서 루터를 처음 만나 감화받은 사람입니다 — 다음 목적지와 이어집니다.", "ko": "스트라스부르", "en": "Strasbourg", "x": 406.3, "y": 496.1}, {"n": 15, "mode": "link", "tag": "1518년, 개혁 사상이 처음으로 다른 사람들에게 옮겨붙은 해.", "sub": "Heidelberg · 독일 · 1518", "lead": "이 도시도 책에 나오지 않습니다. 다만 1518년은 책에서 중요한 해입니다 — 루터가 '탑에서의 경험'을 하고, 아우구스부르크에서 철회를 거부한 해. 그 1518년의 루터를 여기서 읽습니다.", "ex": [{"p": 207, "h": "★ 1518년 - 탑에서의 경험", "t": ["루터의 영적 투쟁은 계속되었다. 그는 로마서를 연구하면서 한 구절에 걸려 넘어졌다. ‘하나님의 의’(the righteousness of God)라는 말이 루터를 괴롭혔다. 그는 이를 ‘죄를 심판하시는 하나님의 공의’로 이해했다. 그는 이렇게 회상했다. “나는 ‘하나님의 의’라는 말을 미워했습니다. 왜냐하면 나는 하나님께서 의로우시기 때문에 죄인들을 벌하신다고 배웠기 때문입니다. 나는 하나님을 사랑할 수 없었습니다. 오히려 하나님을 원망하고 미워했습니다.”", "그러나 루터가 계속 이 구절을 묵상하면서 빛이 비치기 시작했다. 이는 1518년이나 1519년경 비텐베르크 수도원의 탑 방에서 일어난 것으로 추정된다(이를 ‘탑에서의 경험’이라고 부른다). 루터는 깨달았다. 여기에서 말하는 ‘하나님의 의’는 우리를 정죄하는 하나님의 속성이 아니라 하나님께서 우리에게 거저 주시는 선물이라는 것을!"]}, {"p": 208, "h": "'완전히 다시 태어난 것 같았다'", "t": ["루터는 나중에 이렇게 썼다. “마침내 나는 하나님의 긍휼로 밤낮으로 묵상하면서 문맥에 주의를 기울였다. ‘하나님의 의가 계시되어 있나니… 의인은 믿음으로 살리라’(롬 1:17). 그때 나는 하나님의 의가 의인이 하나님의 선물로, 즉 믿음으로 사는 그 의라는 것을 깨달았다. 여기에서 나는 하나님의 의를 수동적 의로, 즉 은혜로우신 하나님께서 우리를 믿음으로 의롭다 인정하심으로 의롭게 하시는 그 의로 이해해야 한다는 것을 느꼈다. 이때 나는 완전히 다시 태어난 것 같았고 열린 문들을 통해 낙원 자체로 들어간 것 같았다.”"]}, {"p": 210, "h": "1518년 아우구스부르크 - 철회 거부", "t": ["그러나 루터는 생각을 바꾸지 않았고 오히려 더욱 대담해졌다. 1518년 아우구스부르크에서 교황 특사 카예탄 추기경과 만났을 때 루터는 철회를 거부했다. 이어 1519년 라이프치히 논쟁에서는 로마 측 대표 요한 에크(Johann Eck, 1486-1543)와 공개 토론을 벌이며 교황의 무오성과 공의회 권위가 절대적일 수 없으며 교황과 공의회도 오류를 범할 수 있다고 공개적으로 선언했다."]}], "ppl": [{"nm": "마르틴 루터", "yr": "1483-1546", "d": "1518년, 복음을 발견하고 교황 특사 앞에서 철회를 거부했다."}], "tl": [["1518", "탑에서의 경험 - 하나님의 의를 새롭게 깨닫다"], ["1518", "아우구스부르크 - 카예탄 추기경에게 철회 거부"]], "nxt": "→ 마지막은 16번 보름스. 1521년, '나는 달리 할 수 없습니다'의 자리입니다.", "more": "1518년 4월 26일, 루터는 이곳에서 열린 어거스틴 수도회 총회에서 '하이델베르크 논쟁'(Heidelberger Disputation)을 벌였습니다. 여기서 그는 인간의 업적과 영광에서 하나님을 찾는 '영광의 신학'을 물리치고 십자가의 고난에서 하나님을 보는 '십자가의 신학'(theologia crucis)을 제시했습니다. 이 자리에서 감화를 받은 청중 가운데 마르틴 부처(14번 스트라스부르)가 있었습니다. 또 1563년 팔츠 선제후 프리드리히 3세의 명으로 이곳에서 「하이델베르크 요리문답」이 작성되어 개혁교회의 대표적 교리 문답서가 되었습니다. 현장에서 볼 것 — 하이델베르크 대학(1386년 설립, 독일 최고(最古))과 하이델베르크 성.", "ko": "하이델베르크", "en": "Heidelberg", "x": 473.6, "y": 431.9}, {"n": 16, "mode": "core", "tag": "'나는 달리 할 수 없습니다. 하나님이여, 저를 도우소서. 아멘.'", "sub": "Worms · 독일 · 1521 보름스 제국 의회", "lead": "투어의 마지막 도시이자, 종교개혁의 결정적 장면. 106년 전 콘스탄츠에서 후스가 한 말과 거의 똑같은 말을, 루터는 여기서 살아남아 합니다.", "ex": [{"p": 210, "h": "소환, 그리고 영웅 같은 여정", "t": ["1521년 4월, 루터는 보름스에서 열린 신성 로마 제국 의회에 소환되었고 황제 카를 5세는 루터에게 안전 통행증을 주었다. 루터는 비텐베르크에서 보름스까지 여행하면서 영웅처럼 환영받았다. 도시마다 군중이 그를 보러 모였다."]}, {"p": 210, "h": "★ 4월 17일 - 첫 번째 질문", "t": ["4월 17일, 루터는 의회 앞에 섰고 황제, 제후들, 주교들, 귀족들이 그를 둘러쌌다. 탁자 위에는 루터가 쓴 책들이 쌓여 있었고, 황제 카를 5세를 대신한 공식 대변인 요하네스 폰 데어 에켄(Johannes von der Ecken)이 질문을 던졌다. “이 책들이 당신이 쓴 것인가?” 루터는 “예.”라고 대답했다. 이어 그는 다시 물었다. “그렇다면 당신은 이 책들의 내용을 철회하겠는가?”"]}, {"p": 211, "h": "하루의 시간을 청하다", "t": ["루터는 즉시 대답하지 않고 하루의 시간을 달라고 요청했다. 그의 저술들은 서로 다른 성격을 가지고 있었기에 무엇을 철회하고 무엇을 지킬지 하나님 앞에서 양심적으로 판단해야 했기 때문이다. 그날 밤 그는 간절히 기도하며 이 문제를 씨름했고 다음 날인 4월 18일 다시 의회 앞에 서서 신중하면서도 단호한 답변을 내놓았다."]}, {"p": 211, "h": "★ 4월 18일 - 나는 달리 할 수 없습니다", "t": ["그는 자신의 저술을 세 부류로 나누어 설명했다. 첫째, 신앙의 기본 진리를 다룬 책들로 누구도 이의를 제기할 수 없는 것들이다. 둘째, 교황청의 폭정과 부패를 비판한 글들이다. 셋째, 특정 인물들을 비판한 책들로, 어조가 지나쳤을 수 있음을 인정했다. 그러나 루터는 내용 자체는 철회할 수 없다고 분명히 말하면서 이렇게 결론지었다. “나는 성경과 분명한 이성에 의해 확신되지 않는 한, 내 주장을 철회할 수 없습니다. 나는 교황들과 공의회들을 신뢰하지 않습니다. 그들은 자주 잘못을 범했고 서로 모순되었기 때문입니다. 나의 양심은 하나님의 말씀에 사로잡혀 있습니다. 양심을 거스르는 것은 안전하지도, 옳지도 않습니다. 나는 달리 할 수 없습니다. 하나님이여, 저를 도우소서. 아멘.”"]}, {"p": 211, "h": "제국의 법 밖에 놓이다", "t": ["이에 황제 카를 5세는 격분했고 곧 루터를 제국의 법 밖에 둔다는 칙령을 발표했는데 이는 누구든 루터를 죽여도 처벌받지 않는다는 뜻이었다.", "그러나 프리드리히 선제후가 그를 살렸다. 루터가 보름스를 떠나 비텐베르크로 돌아가는 길에 선제후의 부하들이 루터를 ‘납치’했는데, 이는 루터를 보호하기 위해 미리 준비된 작전이었다. 루터는 바르트부르크 성으로 옮겨져서 안전하게 숨을 수 있었다."]}, {"p": 194, "h": "★ 106년 전 콘스탄츠에서, 후스가 한 말", "t": ["후스는 이렇게 대답했다. “나는 내가 말하지 않은 것을 철회할 수 없습니다. 내가 실제로 가르친 것들에 대해서는, 만약 그것들이 잘못되었다는 것을 성경으로 증명해 주신다면, 기꺼이 철회하겠습니다. 그러나 나의 양심은 하나님의 말씀에 사로잡혀 있습니다. 성경에 반하는 것을 말하도록 강요받는다면, 나는 거부합니다.”", "이 말은 106년 후 마르틴 루터가 보름스 제국 의회에서 한 말과 거의 똑같다."]}], "ppl": [{"nm": "마르틴 루터", "yr": "1483-1546", "d": "1521년 4월 17-18일, 제국 의회 앞에서 철회를 거부했다."}, {"nm": "황제 카를 5세", "yr": "재위 1519-1556", "d": "루터에게 안전 통행증을 주었으나 이후 그를 제국의 법 밖에 두는 칙령을 내렸다."}, {"nm": "요하네스 폰 데어 에켄", "yr": "—", "d": "황제를 대신해 루터를 심문한 공식 대변인."}], "tl": [["1521.4.16", "루터, 보름스 도착"], ["1521.4.17", "첫 심문 - 하루의 유예 요청"], ["1521.4.18", "★ 철회 거부"], ["1521.5", "보름스 칙령 - 제국의 법 밖에 놓임"], ["1521.5", "귀환길 '납치', 바르트부르크 성으로"]], "nxt": "→ 투어가 마무리됩니다. 여기서 시작된 길이 1번 프랑크푸르트를 지나 집으로 이어집니다.", "more": "현장에서 볼 것 — 제국 의회가 열린 주교궁은 남아 있지 않고, 그 자리(하일스호프 정원)에 루터가 섰던 지점을 표시한 청동판이 있습니다. 1868년 세워진 루터 기념비(Lutherdenkmal)는 세계 최대 규모의 종교개혁 기념 조형물로, 루터를 중심에 두고 위클리프·후스·사보나롤라·발데스 네 선구자를 발치에 앉혔습니다 — 이 투어의 10번 콘스탄츠와 정확히 이어지는 배치입니다. 보름스 대성당은 로마네스크 건축의 정점으로 꼽힙니다.", "ko": "보름스", "en": "Worms", "x": 450.7, "y": 413.6}]};
const P = DATA.places, M = DATA.map;

/* ══════════ 지도 그리기 ══════════ */
const NS="http://www.w3.org/2000/svg";
/* 라벨 방향 [dx,dy] · 표시 좌표 보정 nudge[dx,dy] (3·4번은 실제로 10km 거리라 겹침) */
const LBL={ 1:[-1,0], 2:[-1,-1], 3:[0,1], 4:[0,-1], 5:[1,0], 6:[1,0], 7:[1,0], 8:[1,0],
            9:[1,0], 10:[1,0], 11:[1,0], 12:[-1,0], 13:[-1,-1], 14:[-1,0], 15:[-1,1], 16:[-1,-1] };
const NUDGE={ 4:[3,-19], 3:[-3,5], 13:[-4,-3] };

const svg=document.getElementById("svg");
let VB={x:0,y:0,w:M.w,h:M.h}; const BASE={...VB};
function el(t,a={},p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

const gLand=el("g",{},svg), gRoute=el("g",{},svg), gPins=el("g",{id:"gPins"},svg);
for(const d of Object.values(M.countries)) el("path",{d,class:"country"},gLand);

/* 표시 좌표 */
for(const p of P){ const n=NUDGE[p.n]||[0,0]; p.mx=p.x+n[0]; p.my=p.y+n[1]; }

const pts=P.map(p=>[p.mx,p.my]);
const dRoute="M"+pts.map(p=>p[0]+","+p[1]).join("L");
el("path",{d:dRoute,class:"route"},gRoute);
const routeDone=el("path",{d:dRoute,class:"route-done"},gRoute);
const RL=routeDone.getTotalLength();
routeDone.style.strokeDasharray=RL+" "+RL;
routeDone.style.strokeDashoffset=RL;
routeDone.style.opacity=0;

const arrows=[];
for(let i=0;i<pts.length-1;i++){
  const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
  if(Math.hypot(x2-x1,y2-y1)<26) continue;
  const mx=(x1+x2)/2, my=(y1+y2)/2, ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  arrows.push({e:el("path",{d:"M-6,-4.6L6,0L-6,4.6Z",fill:"var(--ink)","fill-opacity":".5"},gRoute),mx,my,ang});
}

const PIN={};
for(const p of P){
  const g=el("g",{class:p.mode==="link"?"pin link":"pin","data-n":p.n},gPins);
  const dot=el("circle",{cx:p.mx,cy:p.my,r:11,class:"dot"},g);
  const num=el("text",{x:p.mx,y:p.my,class:"num"},g); num.textContent=p.n;
  const lg=el("g",{class:"lbl","data-n":p.n},gPins);
  const line=el("line",{},lg), rect=el("rect",{rx:4},lg), txt=el("text",{},lg);
  txt.textContent=p.n+") "+p.ko;
  PIN[p.n]={p,g,dot,num,lg,line,rect,txt,tw:(p.n+") "+p.ko).length};
}

/* 화면 픽셀 기준 크기 유지 */
function relayout(){
  const r=svg.getBoundingClientRect(); if(!r.width) return;
  const k=VB.w/r.width;
  const narrow=r.width<861;
  const PR = narrow ? (VB.w<BASE.w*0.55 ? 12 : 8.4) : 12.5;
  for(const n in PIN){
    const o=PIN[n], p=o.p, [dx,dy]=LBL[p.n];
    o.dot.setAttribute("r", PR*k);
    o.num.setAttribute("font-size", (PR*0.92)*k);
    const w=(o.tw*12.4+15)*k, h=21*k;
    const ox=(dx===0?0:dx*21*k), oy=dy*(dx===0?25:17)*k;
    const bx=p.mx+ox-(dx>0?0:(dx<0?w:w/2)), by=p.my+oy-h/2;
    const L=Math.hypot(ox,oy)||1;
    o.line.setAttribute("x1",p.mx+ox/L*PR*k); o.line.setAttribute("y1",p.my+oy/L*PR*k);
    o.line.setAttribute("x2",p.mx+ox); o.line.setAttribute("y2",p.my+oy);
    o.rect.setAttribute("x",bx); o.rect.setAttribute("y",by);
    o.rect.setAttribute("width",w); o.rect.setAttribute("height",h);
    o.rect.setAttribute("rx",4*k);
    o.txt.setAttribute("x",bx+7.5*k); o.txt.setAttribute("y",by+h/2);
    o.txt.setAttribute("font-size",12.6*k);
  }
  for(const a of arrows) a.e.setAttribute("transform",`translate(${a.mx},${a.my}) rotate(${a.ang}) scale(${k})`);
  gPins.classList.toggle("nolbl", narrow);
}
function applyVB(){svg.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);relayout();}

/* 방문지 범위에 맞춰 초기 화면 */
const BB=(()=>{const xs=P.map(p=>p.mx),ys=P.map(p=>p.my);
  const pad=90; return {x0:Math.min(...xs)-pad*1.6,x1:Math.max(...xs)+pad*1.6,
                        y0:Math.min(...ys)-pad,y1:Math.max(...ys)+pad};})();
function fit(){
  const r=svg.getBoundingClientRect(); if(!r.width) return;
  const bw=BB.x1-BB.x0, bh=BB.y1-BB.y0, cx=(BB.x0+BB.x1)/2, cy=(BB.y0+BB.y1)/2;
  const ar=r.width/r.height;
  let w,h;
  if(ar > bw/bh){ h=bh; w=bh*ar; } else { w=bw; h=bw/ar; }
  VB={x:cx-w/2,y:cy-h/2,w,h}; Object.assign(BASE,VB); applyVB();
}
addEventListener("resize",()=>{fit();});

/* 확대·축소·이동 */
function zoom(f,cx,cy){
  const r=svg.getBoundingClientRect();
  cx = cx==null ? VB.x+VB.w/2 : VB.x + (cx-r.left)/r.width*VB.w;
  cy = cy==null ? VB.y+VB.h/2 : VB.y + (cy-r.top)/r.height*VB.h;
  const nw=Math.min(BASE.w*1.8,Math.max(BASE.w/10,VB.w/f)), s=nw/VB.w;
  VB={x:cx-(cx-VB.x)*s, y:cy-(cy-VB.y)*s, w:nw, h:VB.h*s}; applyVB();
}
document.getElementById("zin").onclick =()=>zoom(1.6);
document.getElementById("zout").onclick=()=>zoom(1/1.6);
document.getElementById("zrst").onclick=()=>fit();
const wrap=document.getElementById("mapwrap");
wrap.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.16:1/1.16,e.clientX,e.clientY)},{passive:false});

let dg=null, pinching=false;
wrap.addEventListener("pointerdown",e=>{
  if(pinching) return;
  const t=e.target.closest?e.target.closest("[data-n]"):null;
  dg={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y,n:t?+t.dataset.n:0,moved:0};
});
wrap.addEventListener("pointermove",e=>{
  if(!dg||pinching)return;
  const r=svg.getBoundingClientRect();
  dg.moved=Math.max(dg.moved,Math.abs(e.clientX-dg.x)+Math.abs(e.clientY-dg.y));
  if(dg.moved<4)return;
  VB.x=dg.vx-(e.clientX-dg.x)/r.width*VB.w;
  VB.y=dg.vy-(e.clientY-dg.y)/r.height*VB.h; applyVB();
});
function endDrag(e){
  if(!dg)return;
  if(dg.moved<6 && dg.n) openPlace(dg.n);
  dg=null;
}
wrap.addEventListener("pointerup",endDrag);
wrap.addEventListener("pointercancel",()=>dg=null);
wrap.addEventListener("pointerleave",()=>dg=null);

let tdist=0;
wrap.addEventListener("touchstart",e=>{if(e.touches.length===2){pinching=true;dg=null;tdist=td(e)}},{passive:true});
wrap.addEventListener("touchmove",e=>{
  if(e.touches.length===2){e.preventDefault();const d=td(e);
    if(tdist){const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;zoom(d/tdist,mx,my)}
    tdist=d;}
},{passive:false});
wrap.addEventListener("touchend",e=>{if(e.touches.length<2){pinching=false;tdist=0}});
function td(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}

/* 모바일 칩바 */
const chips=document.getElementById("chips");
chips.innerHTML=P.map(p=>`<button data-n="${p.n}" class="${p.mode==='link'?'link':''}"><i>${p.n}</i>${p.ko}</button>`).join("");
chips.onclick=e=>{const t=e.target.closest("[data-n]");if(t)openPlace(+t.dataset.n)};

/* ══════════ 상세 시트 ══════════ */
const sheet=document.getElementById("sheet"), sbody=document.getElementById("sbody");
let cur=null;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* 책의 인라인 목록을 줄바꿈으로 풀어 읽기 쉽게 */
const fmt=s=>esc(s)
  .replace(/\s*([①②③④⑤⑥⑦])\s*/g,"<br>$1 ")
  .replace(/([다요\.\?」』])\s*-\s+/g,"$1<br>· ")
  .replace(/^<br>/,"");

function openPlace(n){
  const p=P.find(x=>x.n===n); if(!p)return;
  cur=n;
  for(const k in PIN) PIN[k].g.classList.toggle("sel", +k===n);
  chips.querySelectorAll("button").forEach(b=>b.classList.toggle("sel",+b.dataset.n===n));
  const cb=chips.querySelector(`button[data-n="${n}"]`); if(cb) cb.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  document.getElementById("s-no").textContent=String(n).padStart(2,"0");
  document.getElementById("s-no").className="no"+(p.mode==="link"?" link":"");
  document.getElementById("s-ko").textContent=p.ko;
  document.getElementById("s-sub").textContent=p.sub;
  document.getElementById("s-tag").textContent=p.tag;

  let h=`<p class="lead">${esc(p.lead)}</p>`;
  h+=`<div class="sec">책 원문 발췌 · 『신약 교회 역사』</div>`;
  for(const e of p.ex){
    h+=`<div class="ex"><div class="exh"><b>${esc(e.h)}</b><span>${e.p}쪽</span></div><div class="exb">`;
    for(const t of e.t) h+=`<p>${fmt(t)}</p>`;
    h+=`</div></div>`;
  }
  if(p.ppl.length){
    h+=`<div class="sec">인물</div><div class="ppl">`;
    for(const q of p.ppl) h+=`<div><b>${esc(q.nm)}</b><em>${esc(q.yr)}</em><p>${esc(q.d)}</p></div>`;
    h+=`</div>`;
  }
  if(p.tl.length){
    h+=`<div class="sec">연표</div><ul class="tl">`;
    for(const [y,e] of p.tl) h+=`<li><b>${esc(y)}</b><span>${esc(e)}</span></li>`;
    h+=`</ul>`;
  }
  if(p.more){
    h+=`<details class="more"><summary>📎 더 알아보기 <span class="badge">책 외 자료</span></summary>
        <div class="mb">${fmt(p.more)}
        <div class="warn">※ 이 영역은 『신약 교회 역사』에 실린 내용이 아니라 별도로 조사해 덧붙인 배경 정보입니다. 위쪽 발췌와 구분해서 읽어 주세요.</div>
        </div></details>`;
  }
  h+=`<div class="nxt">${esc(p.nxt)}</div>`;
  sbody.innerHTML=h; sbody.scrollTop=0;
  sheet.classList.add("on"); sheet.setAttribute("aria-hidden","false");
  document.getElementById("prev").disabled = false;
  document.getElementById("next").disabled = n>=16;
  focusPin(p);
}
function focusPin(p){
  const wide=innerWidth>=861;
  if(wide){
    const sw=document.getElementById("sheet").getBoundingClientRect().width;
    const vis=(innerWidth-sw)/innerWidth;               // 지도가 보이는 비율
    VB.x=p.mx-VB.w*vis*0.5; VB.y=p.my-VB.h/2; applyVB(); return;
  }
  if(VB.w > BASE.w*0.8) return;
  VB.x=p.mx-VB.w/2; VB.y=p.my-VB.h/2; applyVB();
}
function closeSheet(){
  sheet.classList.remove("on"); sheet.setAttribute("aria-hidden","true");
  for(const k in PIN) PIN[k].g.classList.remove("sel");
  chips.querySelectorAll("button").forEach(b=>b.classList.remove("sel")); cur=null;
}
document.getElementById("close").onclick=closeSheet;
document.getElementById("prev").onclick=()=>{cur>1?openPlace(cur-1):openAbout()};
document.getElementById("next").onclick=()=>openPlace(cur?cur+1:1);
addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  if(!cur)return;
  if(e.key==="ArrowLeft"&&cur>1)openPlace(cur-1);
  if(e.key==="ArrowRight"&&cur<16)openPlace(cur+1);
});
/* 모바일 시트 드래그로 닫기 */
{
  const grab=document.getElementById("grab"); let sy=0,on=false;
  grab.addEventListener("pointerdown",e=>{on=true;sy=e.clientY;sheet.style.transition="none";grab.setPointerCapture(e.pointerId)});
  grab.addEventListener("pointermove",e=>{if(on){const d=Math.max(0,e.clientY-sy);sheet.style.transform=`translateY(${d}px)`}});
  grab.addEventListener("pointerup",e=>{
    if(!on)return; on=false; sheet.style.transition="";
    const d=e.clientY-sy; sheet.style.transform="";
    if(d>110) closeSheet();
  });
}

  sbody.innerHTML=`
    <div class="ofl" id="ofl"><span class="ic">…</span><div><b>오프라인 저장 상태를 확인하는 중</b><small>잠시만 기다려 주세요</small></div></div>

      <p>· <b>검색</b> — 이 앱에 실린 책 발췌 전체에서 단어를 찾습니다. '양심', '침례', '화형' 같은 말로 찾으면 도시를 가로지르는 흐름이 보입니다.</p>
      <p>· 해설 아래 <b>◀ 이전 / 다음 ▶</b> 으로 여정 순서대로 넘길 수 있습니다.</p>

      <p>본문 발췌는 전부 <b>정동수, 『신약 교회 역사 — 침례교회와 신앙의 자유』</b>(그리스도예수안에, 2026, 587쪽)에서 가져왔습니다. 지어낸 해설이 아니라 <b>책의 문장을 그대로</b> 옮기고, 각 발췌마다 <b>쪽수</b>를 달았습니다. 더 깊이 보고 싶을 때 종이책 몇 쪽을 펴면 되는지 바로 알 수 있습니다.</p>
      <p>16곳 가운데 <b>11곳</b>은 책에 직접 서술이 있습니다. 나머지 <b>5곳</b>(프랑크푸르트·드레스덴·뉘른베르크·뮌헨·하이델베르크)은 이 책이 침례교·신약 교회 회복이라는 한 줄기를 따라가느라 다루지 않은 도시입니다. 이 다섯 곳은 지도에서 <b>회색 핀</b>으로 표시했고, 책 안에서 연결되는 대목을 대신 붙였습니다.</p>

    <div class="ex"><div class="exb">
      <p>3번 에르푸르트와 4번 슈토테른하임은 실제로 10km 거리라 지도에서는 겹치지 않게 조금 벌려 표시했습니다.</p>
      <p>발췌는 개인 학습과 투어 동행자 공유를 위한 범위로 제한했습니다. 책 전체를 대신하지 않으니, 깊이 읽으려면 원서를 함께 보시기를 권합니다.</p>
    </div></div>

/* ══════════ 연표 ══════════ */
{
  const ev=[];
  for(const p of P) for(const [y,e] of p.tl) ev.push({y,e,n:p.n,ko:p.ko,mode:p.mode});
  const key=s=>{const m=s.match(/\d{3,4}/);return m?+m[0]:9999;};
  const key2=s=>{const m=s.match(/\d{3,4}\D+(\d{1,2})/);return m?+m[1]:0;};
  ev.sort((a,b)=>key(a.y)-key(b.y)||key2(a.y)-key2(b.y)||a.n-b.n);

    else mg.push({y:x.y,e:x.e,n:x.n,mode:x.mode,w:[`${x.n}) ${x.ko}`]});
  }

{

/* ══════════ 검색 ══════════ */
{
  const idx=[];
  for(const p of P){
    for(const e of p.ex) for(const t of e.t) idx.push({n:p.n,ko:p.ko,h:e.h,pg:e.p,t,src:"발췌"});
    for(const q of p.ppl) idx.push({n:p.n,ko:p.ko,h:"인물 · "+q.nm,pg:null,t:q.d,src:"인물"});
    idx.push({n:p.n,ko:p.ko,h:"소개",pg:null,t:p.tag+" "+p.lead,src:"소개"});
    if(p.more) idx.push({n:p.n,ko:p.ko,h:"더 알아보기 (책 외)",pg:null,t:p.more,src:"책외"});
  }
  const q=document.getElementById("q"), hits=document.getElementById("hits"), hint=document.getElementById("qhint");
  let tm;
  q.oninput=()=>{clearTimeout(tm);tm=setTimeout(run,140)};
  function run(){
    const s=q.value.trim();
    if(s.length<1){hits.innerHTML="";hint.textContent="앱에 실린 책 발췌 전체에서 찾습니다.";return;}
    const rx=new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    const r=idx.filter(x=>x.t.match(rx)).slice(0,120);
    hint.textContent=`"${s}" — ${r.length}건${r.length>=120?"+":""}`;
    hits.innerHTML=r.map(x=>{
      const i=x.t.search(rx), a=Math.max(0,i-70), b=Math.min(x.t.length,i+190);
      let sn=(a>0?"…":"")+x.t.slice(a,b)+(b<x.t.length?"…":"");
      return `<div class="hit" data-n="${x.n}">
        <div class="hh">${x.n}) ${esc(x.ko)} · ${esc(x.h)}${x.pg?" · "+x.pg+"쪽":""}</div>
        <div class="ht">${esc(sn).replace(rx,m=>"<mark>"+m+"</mark>")}</div></div>`;
    }).join("") || `<div class="hint">검색 결과가 없습니다.</div>`;
  }
  hits.onclick=e=>{const t=e.target.closest("[data-n]");if(t){document.getElementById("t-map").click();openPlace(+t.dataset.n)}};
}

/* ══════════ 오프라인(PWA) ══════════ */
let OFL="wait";
function paintOfl(){
  const b=document.getElementById("ofl"); if(!b)return;
  const M={ok:["✓","오프라인 저장 완료","이제 인터넷 없이도 열립니다"],
           wait:["↓","저장하는 중","이 화면을 잠시 열어 두세요"],
           no:["!","이 브라우저에서는 저장할 수 없습니다","사파리나 크롬으로 열어 주세요"]}[OFL];
  b.className="ofl "+(OFL==="ok"?"ok":OFL==="wait"?"wait":"");
  b.innerHTML=`<span class="ic">${M[0]}</span><div><b>${M[1]}</b><small>${M[2]}</small></div>`;
}
if("serviceWorker" in navigator){
  const done=()=>{OFL="ok";paintOfl()};
  navigator.serviceWorker.register("sw.js").then(reg=>{
    if(navigator.serviceWorker.controller) done();
    navigator.serviceWorker.addEventListener("controllerchange",done);
    const t=setInterval(()=>{ if(navigator.serviceWorker.controller){done();clearInterval(t);} },600);
    setTimeout(()=>clearInterval(t),20000);
  }).catch(()=>{OFL="no";paintOfl()});
} else { OFL="no"; }

fit();
setTimeout(()=>{openAbout();paintOfl();},220);
